<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">mono-blocks full-stack OIDC quickstart architecture</title>
  <desc id="desc">The React SPA authenticates against Keycloak with the OIDC authorization code flow and PKCE, then calls the Spring Boot resource server with a bearer JWT, which validates the token against Keycloak and reads the tenant_id claim. Postgres/PostGIS is wired as the datasource for JPA and Flyway.</desc>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .title { font-size: 30px; font-weight: 700; fill: #1e293b; }
    .subtitle { font-size: 16px; fill: #64748b; }
    .node-title { font-size: 19px; font-weight: 600; }
    .node-sub { font-size: 13px; }
    .edge-label { font-size: 13px; font-weight: 600; fill: #334155; }
    .edge-label-bg { fill: #ffffff; }
    .legend { font-size: 14px; fill: #475569; }
    .swatch-title { font-size: 15px; font-weight: 600; fill: #334155; }

    /* Flowing connector dashes — the bearer JWT and JWKS call-path directions */
    @keyframes dashflow { to { stroke-dashoffset: -32; } }
    .flow {
      stroke-dasharray: 8 10;
      animation: dashflow 1.3s linear infinite;
    }

    /* Token dots travelling the API-call and JWT-validation paths */
    @keyframes down { from { transform: translateY(0); } to { transform: translateY(118px); } }
    @keyframes diag { from { transform: translate(0,0); } to { transform: translate(295px, -134px); } }
    .dot-down { animation: down 2s linear infinite; }
    .dot-diag { animation: diag 2s linear infinite; }
    .dot { fill: #4f46e5; stroke: #ffffff; stroke-width: 2px; }

    /* Authority pulse around Keycloak */
    @keyframes ring {
      0% { transform: scale(1); opacity: 0.55; }
      80%, 100% { transform: scale(1.55); opacity: 0; }
    }
    .ring {
      fill: none;
      stroke: #ea580c;
      stroke-width: 3px;
      opacity: 0.55;
      animation: ring 2.4s ease-out infinite;
      transform-origin: center;
      transform-box: fill-box;
    }

    /* Live dot at the API during validation */
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    .blink { animation: blink 1.8s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .flow, .dot-down, .dot-diag, .ring, .blink { animation: none; }
      .dot { visibility: hidden; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- ======================= Heading ======================= -->
  <g id="heading">
    <text x="48" y="50" class="title">mono-blocks</text>
    <text x="48" y="76" class="subtitle">Minimal full-stack quickstart — OIDC auth from a React SPA to a Spring Boot API, end to end</text>
  </g>

  <!-- ======================= Legend ======================= -->
  <g id="legend">
    <text x="760" y="52" class="swatch-title">Legend</text>
    <rect x="760" y="66" width="16" height="16" rx="4" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="786" y="80" class="legend">Application (owned)</text>
    <rect x="760" y="94" width="16" height="16" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="786" y="108" class="legend">Identity provider (external)</text>
    <rect x="760" y="122" width="16" height="16" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
    <text x="786" y="136" class="legend">Data / infrastructure</text>
  </g>

  <!-- ======================= Edges ======================= -->
  <g id="edges">
    <!-- E1: React <-> Keycloak OIDC code flow + PKCE -->
    <path d="M 320 153 H 500" fill="none" stroke="#64748b" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <rect x="348" y="120" width="124" height="22" rx="6" class="edge-label-bg"/>
    <text x="410" y="136" text-anchor="middle" class="edge-label">OIDC · PKCE S256</text>

    <!-- E2: React -> API call with bearer JWT (animated) -->
    <path class="flow" d="M 205 196 V 320" fill="none" stroke="#4f46e5" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="251" y="230" width="170" height="24" rx="6" class="edge-label-bg"/>
    <text x="336" y="247" text-anchor="middle" class="edge-label">GET /api/me · Bearer JWT</text>

    <!-- E3: API -> Keycloak JWT validation (animated) -->
    <path class="flow" d="M 320 330 L 615 196" fill="none" stroke="#ea580c" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="423" y="249" width="94" height="22" rx="6" class="edge-label-bg"/>
    <text x="470" y="266" text-anchor="middle" class="edge-label">validate JWT</text>

    <!-- E4: API -> Postgres datasource -->
    <path d="M 205 406 V 530" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="249" y="444" width="149" height="24" rx="6" class="edge-label-bg"/>
    <text x="323" y="461" text-anchor="middle" class="edge-label">JPA · Flyway · PostGIS</text>
  </g>

  <!-- ======================= Nodes ======================= -->
  <g id="nodes">
    <!-- React SPA -->
    <g id="node-react">
      <rect x="90" y="110" width="230" height="86" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
      <text x="205" y="146" text-anchor="middle" class="node-title" fill="#1e2a5a">React SPA</text>
      <text x="205" y="170" text-anchor="middle" class="node-sub" fill="#4f46e5">localhost:5173</text>
    </g>

    <!-- Keycloak -->
    <g id="node-keycloak">
      <circle cx="615" cy="153" r="58" class="ring"/>
      <rect x="500" y="110" width="230" height="86" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
      <text x="615" y="146" text-anchor="middle" class="node-title" fill="#7c2d12">Keycloak</text>
      <text x="615" y="170" text-anchor="middle" class="node-sub" fill="#ea580c">localhost:8081 · realm "forest"</text>
    </g>

    <!-- Spring Boot API -->
    <g id="node-api">
      <circle cx="205" cy="386" r="7" fill="#22c55e" class="blink"/>
      <rect x="90" y="320" width="230" height="86" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
      <text x="205" y="356" text-anchor="middle" class="node-title" fill="#1e2a5a">Spring Boot API</text>
      <text x="205" y="380" text-anchor="middle" class="node-sub" fill="#4f46e5">localhost:8080 · resource server</text>
    </g>

    <!-- Postgres -->
    <g id="node-postgres">
      <rect x="90" y="530" width="230" height="86" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
      <text x="205" y="566" text-anchor="middle" class="node-title" fill="#064e3b">Postgres / PostGIS</text>
      <text x="205" y="590" text-anchor="middle" class="node-sub" fill="#059669">localhost:5432 · docker compose</text>
    </g>
  </g>

  <!-- ======================= Animated token dots ======================= -->
  <g id="tokens">
    <circle class="dot dot-down" cx="205" cy="200" r="6"/>
    <circle class="dot dot-diag" cx="320" cy="330" r="6"/>
  </g>

  <!-- ======================= Footer ======================= -->
  <g id="footer">
    <text x="48" y="628" font-size="13" fill="#94a3b8">demo scaffold · one protected endpoint · three seeded Keycloak users · reduced-motion aware</text>
  </g>
</svg>