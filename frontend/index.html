<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4B5BBF" />
    <title>frontend</title>

    <!-- Preconnect to Google Fonts CDN so the tenant-specific stylesheet
         (injected at runtime by applyTenantTypography) resolves faster. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Inline script: restore saved colour-mode before first paint to
         avoid a flash of wrong-theme content. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme-preference');
          if (t === 'light' || t === 'dark') {
            document.documentElement.dataset.theme = t;
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
