name: PR Open Build

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.number }}
  # Cancel only new pushes (before native compile starts); do not kill an
  # in-flight build so the next merge to main gets a clean cache.
  cancel-in-progress: ${{ !contains(github.event.action, 'synchronize') == false && github.event.action != 'opened' || true }}

permissions:
  contents: read
  packages: write

jobs:
  metadata:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Read project <version> (line 13), NOT parent Spring Boot version (line 8).
      - name: Extract project version from pom.xml
        id: version
        run: |
          VERSION=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('backend/pom.xml').getroot().find('{http://maven.apache.org/POM/4.0.0}version').text)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check for Git Tag
        id: tag
        run: |
          TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || echo "")
          if [ -n "$TAG" ]; then
            echo "found=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Set Image Tag
        id: set
        run: |
          if [ -n "${{ steps.tag.outputs.found }}" ]; then
            IMAGE_TAG="${{ steps.tag.outputs.found }}.${{ github.event.number }}"
          else
            IMAGE_TAG="${{ steps.version.outputs.version }}.${{ github.event.number }}"
          fi
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Verify
        run: echo "Building image with tag: ${{ steps.set.outputs.image_tag }}"

  build:
    name: Native Build & Push
    runs-on: ubuntu-latest
    needs: [metadata]
    steps:
      - uses: actions/checkout@v5

      # GHCR image names must be lowercase — repo slugs are lowercased.
      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/spat" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check backend changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'

      - name: Retag existing (cache skip)
        if: steps.changes.outputs.backend == 'false'
        run: |
          echo "Backend unchanged — retagging latest from main."
          REGISTRY="ghcr.io/${GITHUB_REPOSITORY,,}"
          IMAGE="$REGISTRY/spat"
          # Pull latest from main and re-tag with PR-specific label so review
          # apps can address it while still running the same binary.
          docker pull "$IMAGE:latest" || { echo "No existing image on main yet"; exit 1; }
          docker tag "$IMAGE:latest" "${{ steps.image.outputs.name }}:${{ needs.metadata.outputs.image_tag }}"
          docker push "${{ steps.image.outputs.name }}:${{ needs.metadata.outputs.image_tag }}"

      - name: Build & push (with cache)
        if: steps.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ needs.metadata.outputs.image_tag }}
          build-args: APP_VERSION=${{ needs.metadata.outputs.image_tag }}
          # PRs are READ-ONLY: restore warm layers from the registry-only cache.
          # Never write back — only push-to-main-exporter.yml writes the registry.
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository }}/spat:buildcache
          cache-to: ""
