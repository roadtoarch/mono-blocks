<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NorthPac Moving & Storage — Landing Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html{font-size:100%;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;scroll-behavior:smooth}
    body{font-family:'Source Sans Pro',sans-serif;line-height:1.5;color:var(--color-text);background:var(--color-bg);transition:background-color 200ms ease-out,color 200ms ease-out}

    /* ── Design Tokens ── */
    :root {
      /* Primary palette — green from NorthPac logo */
      --color-primary-50: oklch(0.966 0.007 160.1);
      --color-primary-100: oklch(0.92 0.02 158);
      --color-primary-200: oklch(0.85 0.04 156);
      --color-primary-300: oklch(0.75 0.06 155);
      --color-primary-400: oklch(0.62 0.08 156);
      --color-primary-500: oklch(0.383 0.083 156.3);
      --color-primary-600: oklch(0.380 0.100 147.5);
      --color-primary-700: oklch(0.380 0.088 158.4);
      --color-primary-800: oklch(0.28 0.06 156);
      --color-primary-900: oklch(0.205 0.020 160.1);

      /* Neutral palette — hue 160 green tint */
      --color-neutral-50: oklch(0.966 0.007 160.1);
      --color-neutral-100: oklch(0.945 0.014 162.5);
      --color-neutral-200: oklch(0.90 0.015 160);
      --color-neutral-300: oklch(0.83 0.015 160);
      --color-neutral-400: oklch(0.65 0.015 160);
      --color-neutral-500: oklch(0.50 0.015 160);
      --color-neutral-600: oklch(0.38 0.015 160);
      --color-neutral-700: oklch(0.30 0.020 172.7);
      --color-neutral-800: oklch(0.248 0.024 172.7);
      --color-neutral-900: oklch(0.205 0.020 160.1);

      /* Spacing */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --space-10: 40px;
      --space-12: 48px;
      --space-16: 64px;

      /* Border radius */
      --radius-sm: 2px;
      --radius-md: 4px;
      --radius-lg: 8px;
      --radius-xl: 12px;
      --radius-full: 999px;

      /* Typography scale */
      --text-xs: 0.75rem;
      --text-sm: 0.875rem;
      --text-base: 1rem;
      --text-lg: 1.125rem;
      --text-xl: 1.25rem;
      --text-2xl: 1.5rem;
      --text-3xl: 2rem;
      --text-4xl: 2.5rem;
    }

    /* Light mode tokens */
    [data-theme="light"] {
      --color-bg: oklch(0.966 0.007 160.1);
      --color-surface: oklch(0.945 0.014 162.5);
      --color-surface-raised: #ffffff;
      --color-text: var(--color-neutral-900);
      --color-text-muted: var(--color-neutral-600);
      --color-border: var(--color-neutral-200);
      --shadow-layer-1: 0 1px 3px oklch(0.3 0.01 260 / 0.08);
      --shadow-layer-2: 0 4px 12px oklch(0.3 0.01 260 / 0.06);
      --shadow-layer-3: 0 12px 32px oklch(0.3 0.01 260 / 0.04);
      --shadow-card: var(--shadow-layer-1), var(--shadow-layer-2), var(--shadow-layer-3);
      --shadow-button: 0 1px 2px oklch(0.3 0.01 260 / 0.12), 0 2px 6px oklch(0.3 0.01 260 / 0.08);
    }

    /* Dark mode tokens */
    [data-theme="dark"] {
      --color-bg: oklch(0.205 0.020 160.1);
      --color-surface: oklch(0.248 0.024 172.7);
      --color-surface-raised: var(--color-neutral-700);
      --color-text: var(--color-neutral-50);
      --color-text-muted: var(--color-neutral-400);
      --color-border: var(--color-neutral-700);
      --shadow-card: 0 0 0 1px var(--color-neutral-700);
      --shadow-button: 0 0 0 1px var(--color-neutral-600);
    }

    /* ── Shared Utilities ── */
    .landing-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-8) var(--space-4);
      position: relative;
    }

    .landing-card {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: var(--space-12) var(--space-8);
      border-radius: var(--radius-xl);
      background: var(--color-surface-raised);
      box-shadow: var(--shadow-card);
    }

    .landing-logo {
      width: 80px;
      height: 80px;
      margin-bottom: var(--space-8);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .landing-logo svg {
      width: 100%;
      height: 100%;
    }

    .landing-heading {
      font-size: var(--text-3xl);
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: var(--space-4);
      color: var(--color-text);
    }

    .landing-body {
      font-size: var(--text-base);
      line-height: 1.5;
      color: var(--color-text-muted);
      margin-bottom: var(--space-8);
      max-width: 320px;
    }

    .btn-signin {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-3) var(--space-8);
      font-family: inherit;
      font-size: var(--text-base);
      font-weight: 600;
      line-height: 1;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: transform 120ms ease-out, box-shadow 120ms ease-out, background-color 120ms ease-out;
      border: none;
      background: var(--color-primary-500);
      color: #ffffff;
      box-shadow: var(--shadow-button);
    }

    .btn-signin:hover {
      background: var(--color-primary-600);
    }

    .btn-signin:active {
      transform: scale(0.96);
    }

    .btn-signin:focus-visible {
      outline: 2px solid var(--color-primary-400);
      outline-offset: 2px;
    }

    .landing-footer {
      margin-top: var(--space-8);
      font-size: var(--text-sm);
      color: var(--color-text-muted);
    }

    /* ── Dark Mode Toggle ── */
    .theme-toggle {
      position: fixed;
      top: var(--space-4);
      right: var(--space-4);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: var(--radius-full);
      border: 1px solid var(--color-border);
      background: var(--color-surface-raised);
      color: var(--color-text);
      cursor: pointer;
      font-size: var(--text-lg);
      box-shadow: var(--shadow-card);
      transition: transform 120ms ease-out;
    }

    .theme-toggle:hover {
      transform: scale(1.05);
    }

    .theme-toggle:active {
      transform: scale(0.96);
    }

    .theme-toggle:focus-visible {
      outline: 2px solid var(--color-primary-400);
      outline-offset: 2px;
    }

    /* ── Variant 1: Industrial Strength ── */
    .v1-landing {
      background: linear-gradient(165deg, oklch(0.22 0.06 145) 0%, oklch(0.18 0.05 145) 40%, oklch(0.15 0.04 145) 100%);
    }

    .v1-landing[data-theme="dark"] {
      background: linear-gradient(165deg, oklch(0.12 0.05 145) 0%, oklch(0.10 0.04 145) 40%, oklch(0.08 0.03 145) 100%);
    }

    .v1-card {
      background: oklch(1 0 0 / 0.04);
      backdrop-filter: blur(20px) saturate(1.2);
      -webkit-backdrop-filter: blur(20px) saturate(1.2);
      border: 1px solid oklch(1 0 0 / 0.08);
    }

    [data-theme="light"] .v1-card {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid oklch(0.3 0.01 260 / 0.1);
    }

    .v1-heading {
      font-size: var(--text-4xl);
      font-weight: 700;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      color: var(--color-primary-100);
    }

    [data-theme="light"] .v1-heading {
      color: var(--color-neutral-900);
    }

    .v1-body {
      color: oklch(0.85 0.02 145 / 0.8);
    }

    [data-theme="light"] .v1-body {
      color: var(--color-neutral-600);
    }

    .v1-btn {
      background: var(--color-primary-600);
      color: #ffffff;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: var(--space-4) var(--space-10);
      border-radius: var(--radius-sm);
    }

    .v1-btn:hover {
      background: var(--color-primary-700);
    }

    /* Geometric decorative elements */
    .v1-decorator {
      position: absolute;
      pointer-events: none;
    }

    .v1-decorator-1 {
      top: 10%;
      left: 5%;
      width: 120px;
      height: 120px;
      border: 2px solid oklch(0.55 0.15 145 / 0.15);
      border-radius: var(--radius-sm);
      transform: rotate(45deg);
    }

    .v1-decorator-2 {
      bottom: 15%;
      right: 8%;
      width: 80px;
      height: 80px;
      background: oklch(0.55 0.15 145 / 0.08);
      border-radius: var(--radius-sm);
    }

    .v1-decorator-3 {
      top: 25%;
      right: 12%;
      width: 0;
      height: 0;
      border-left: 40px solid transparent;
      border-right: 40px solid transparent;
      border-bottom: 70px solid oklch(0.55 0.15 145 / 0.06);
    }

    /* ── Variant 2: Nature Connected ── */
    .v2-landing {
      background: linear-gradient(145deg, oklch(0.92 0.04 145) 0%, oklch(0.95 0.03 145) 50%, oklch(0.90 0.05 145) 100%);
    }

    .v2-landing[data-theme="dark"] {
      background: linear-gradient(145deg, oklch(0.20 0.04 145) 0%, oklch(0.17 0.03 145) 50%, oklch(0.15 0.04 145) 100%);
    }

    .v2-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: var(--radius-xl);
      border: 1px solid oklch(0.55 0.15 145 / 0.12);
    }

    [data-theme="dark"] .v2-card {
      background: oklch(0.22 0.03 145 / 0.8);
      border: 1px solid oklch(0.55 0.15 145 / 0.15);
    }

    .v2-heading {
      font-size: var(--text-3xl);
      font-weight: 700;
      color: var(--color-primary-800);
    }

    [data-theme="dark"] .v2-heading {
      color: var(--color-primary-100);
    }

    .v2-body {
      color: var(--color-primary-700);
    }

    [data-theme="dark"] .v2-body {
      color: var(--color-primary-200);
    }

    .v2-btn {
      background: var(--color-primary-500);
      color: #ffffff;
      font-weight: 600;
      border-radius: var(--radius-full);
      padding: var(--space-3) var(--space-8);
    }

    .v2-btn:hover {
      background: var(--color-primary-600);
    }

    /* Leaf decorative elements */
    .v2-leaf {
      position: absolute;
      pointer-events: none;
      opacity: 0.12;
    }

    .v2-leaf-1 {
      top: 8%;
      left: 8%;
      width: 100px;
      height: 100px;
      background: var(--color-primary-400);
      border-radius: 0 80% 0 80%;
      transform: rotate(-30deg);
    }

    .v2-leaf-2 {
      bottom: 12%;
      right: 6%;
      width: 70px;
      height: 70px;
      background: var(--color-primary-300);
      border-radius: 80% 0 80% 0;
      transform: rotate(20deg);
    }

    .v2-leaf-3 {
      top: 20%;
      right: 15%;
      width: 50px;
      height: 50px;
      background: var(--color-primary-500);
      border-radius: 50% 0 50% 0;
      transform: rotate(45deg);
      opacity: 0.08;
    }

    .v2-leaf-4 {
      bottom: 25%;
      left: 12%;
      width: 40px;
      height: 40px;
      background: var(--color-primary-600);
      border-radius: 0 50% 0 50%;
      transform: rotate(-15deg);
      opacity: 0.06;
    }

    /* ── Variant 3: Professional Clean ── */
    .v3-landing {
      background: oklch(0.966 0.007 160.1);
    }

    .v3-landing[data-theme="dark"] {
      background: oklch(0.205 0.020 160.1);
    }

    .v3-card {
      background: var(--color-surface-raised);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
    }

    .v3-heading {
      font-size: var(--text-2xl);
      font-weight: 600;
      color: var(--color-neutral-900);
    }

    [data-theme="dark"] .v3-heading {
      color: var(--color-neutral-50);
    }

    .v3-body {
      color: var(--color-neutral-600);
    }

    [data-theme="dark"] .v3-body {
      color: var(--color-neutral-400);
    }

    .v3-btn {
      background: var(--color-primary-500);
      color: #ffffff;
      font-weight: 600;
      border-radius: var(--radius-md);
      padding: var(--space-3) var(--space-8);
    }

    .v3-btn:hover {
      background: var(--color-primary-600);
    }

    .v3-footer {
      color: var(--color-neutral-500);
    }

    /* ── Logo SVG styles ── */
    .logo-svg {
      fill: currentColor;
    }

    .landing-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* ── Feature badges ── */
    .feature-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-3);
      margin-bottom: var(--space-6);
      width: 100%;
      max-width: 320px;
    }

    .feature-badge {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      font-weight: 600;
      line-height: 1.2;
    }

    .feature-badge .icon {
      font-size: var(--text-lg);
      flex-shrink: 0;
    }

    /* V1 feature badges */
    .v1-features .feature-badge {
      background: oklch(0.55 0.15 145 / 0.12);
      color: var(--color-primary-100);
    }

    [data-theme="light"] .v1-features .feature-badge {
      background: var(--color-primary-50);
      color: var(--color-primary-700);
    }

    /* V2 feature badges */
    .v2-features .feature-badge {
      background: oklch(0.966 0.007 160.1 / 0.6);
      color: var(--color-primary-700);
      border: 1px solid oklch(0.383 0.083 156.3 / 0.1);
    }

    [data-theme="dark"] .v2-features .feature-badge {
      background: oklch(0.248 0.024 172.7 / 0.6);
      color: var(--color-primary-200);
      border: 1px solid oklch(0.383 0.083 156.3 / 0.15);
    }

    /* V3 feature badges */
    .v3-features .feature-badge {
      background: var(--color-neutral-100);
      color: var(--color-neutral-700);
      border: 1px solid var(--color-border);
    }

    [data-theme="dark"] .v3-features .feature-badge {
      background: var(--color-neutral-800);
      color: var(--color-neutral-200);
      border: 1px solid var(--color-neutral-700);
    }

    /* ── Tagline ── */
    .variant-tagline {
      font-size: var(--text-sm);
      font-style: italic;
      margin-bottom: var(--space-4);
      max-width: 300px;
    }

    .v1-tagline { color: oklch(0.85 0.02 145 / 0.7); }
    [data-theme="light"] .v1-tagline { color: var(--color-neutral-500); }
    .v2-tagline { color: var(--color-primary-600); }
    [data-theme="dark"] .v2-tagline { color: var(--color-primary-300); }
    .v3-tagline { color: var(--color-neutral-500); font-weight: 600; font-style: normal; letter-spacing: 0.04em; text-transform: uppercase; font-size: var(--text-xs); }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .landing-card {
        padding: var(--space-8) var(--space-6);
      }
      .v1-heading, .v2-heading {
        font-size: var(--text-2xl);
      }
      .v3-heading {
        font-size: var(--text-xl);
      }
    }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
      }
    }

    /* ── Picker ── */
    .proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,0.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,0.08) inset,0 8px 24px rgba(0,0,0,0.24),0 2px 6px rgba(0,0,0,0.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
    .proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,0.12);will-change:transform}
    .proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(0.23,1,0.32,1),width 250ms cubic-bezier(0.23,1,0.32,1)}
    @media(prefers-reduced-motion:reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}}
    .proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,0.55);font:inherit;cursor:pointer;transition:color 150ms ease-out}
    .proto-picker-item:hover{color:rgba(255,255,255,0.85)}
    .proto-picker-item:active{transform:scale(0.97)}
    .proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,0.4);outline-offset:2px}
    .proto-picker-item[data-active]{color:#fff}
  </style>
</head>
<body>
  <div id="stage"></div>

  <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
    <span id="themeIcon">☀️</span>
  </button>

  <nav class="proto-picker" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Industrial Strength</button>
    <button class="proto-picker-item">Nature Connected</button>
    <button class="proto-picker-item">Professional Clean</button>
  </nav>

  <script>
    function northPacLogo() {
      return `<img src="northpac-logo.png" alt="NorthPac Moving & Storage logo" width="80" height="80"/>`;
    }

    function featureBadges(features, extraClass) {
      return `<div class="feature-grid ${extraClass || ''}">${features.map(f =>
        `<div class="feature-badge"><span class="icon">${f.icon}</span>${f.label}</div>`
      ).join('')}</div>`;
    }

    function landingPage(opts) {
      return `
        <div class="landing-container ${opts.containerClass || ''}" ${opts.containerAttrs || ''}>
          ${opts.decorators || ''}
          <div class="landing-card ${opts.cardClass || ''}">
            <div class="landing-logo">${northPacLogo()}</div>
            <h1 class="landing-heading ${opts.headingClass || ''}">${opts.heading}</h1>
            <p class="variant-tagline ${opts.taglineClass || ''}">${opts.tagline}</p>
            <p class="landing-body ${opts.bodyClass || ''}">${opts.body}</p>
            ${featureBadges(opts.features, opts.featuresClass)}
            <button class="btn-signin ${opts.btnClass || ''}">Sign in</button>
          </div>
          <p class="landing-footer ${opts.footerClass || ''}">${opts.footer}</p>
        </div>
      `;
    }

    const variant1 = () => landingPage({
      containerClass: 'v1-landing',
      cardClass: 'v1-card',
      headingClass: 'v1-heading',
      bodyClass: 'v1-body',
      btnClass: 'v1-btn',
      taglineClass: 'v1-tagline',
      featuresClass: 'v1-features',
      heading: 'Welcome to NorthPac Moving & Storage',
      tagline: 'Moving your world forward.',
      body: 'Professional Moving & Storage Solutions',
      footer: '© NorthPac Moving & Storage',
      features: [
        { icon: '📦', label: 'Local Moves' },
        { icon: '🚚', label: 'Long Distance' },
        { icon: '🏠', label: 'Secure Storage' },
        { icon: '🏢', label: 'Commercial' }
      ],
      decorators: `
        <div class="v1-decorator v1-decorator-1" aria-hidden="true"></div>
        <div class="v1-decorator v1-decorator-2" aria-hidden="true"></div>
        <div class="v1-decorator v1-decorator-3" aria-hidden="true"></div>
      `
    });

    const variant2 = () => landingPage({
      containerClass: 'v2-landing',
      cardClass: 'v2-card',
      headingClass: 'v2-heading',
      bodyClass: 'v2-body',
      btnClass: 'v2-btn',
      taglineClass: 'v2-tagline',
      featuresClass: 'v2-features',
      heading: 'Welcome to NorthPac Moving & Storage',
      tagline: 'Your belongings, safely transported.',
      body: 'Professional Moving & Storage Solutions',
      footer: '© NorthPac Moving & Storage',
      features: [
        { icon: '🏡', label: 'Residential Moves' },
        { icon: '🌡️', label: 'Climate-Controlled Storage' },
        { icon: '📋', label: 'Packing Services' },
        { icon: '🚗', label: 'Vehicle Transport' }
      ],
      decorators: `
        <div class="v2-leaf v2-leaf-1" aria-hidden="true"></div>
        <div class="v2-leaf v2-leaf-2" aria-hidden="true"></div>
        <div class="v2-leaf v2-leaf-3" aria-hidden="true"></div>
        <div class="v2-leaf v2-leaf-4" aria-hidden="true"></div>
      `
    });

    const variant3 = () => landingPage({
      containerClass: 'v3-landing',
      cardClass: 'v3-card',
      headingClass: 'v3-heading',
      bodyClass: 'v3-body',
      btnClass: 'v3-btn',
      footerClass: 'v3-footer',
      taglineClass: 'v3-tagline',
      featuresClass: 'v3-features',
      heading: 'Welcome to NorthPac Moving & Storage',
      tagline: 'Trusted. Professional. On Time.',
      body: 'Professional Moving & Storage Solutions',
      footer: '© NorthPac Moving & Storage',
      features: [
        { icon: '🏬', label: 'Office Relocations' },
        { icon: '📦', label: 'Warehouse Storage' },
        { icon: '📊', label: 'Inventory Management' },
        { icon: '🌎', label: 'Nationwide Coverage' }
      ]
    });

    const variants = [variant1, variant2, variant3];

    /* ── Theme Toggle ── */
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      themeIcon.textContent = theme === 'dark' ? '🌙' : '☀️';
      localStorage.setItem('northpac-theme', theme);
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      setTheme(current === 'dark' ? 'light' : 'dark');
    }

    themeToggle.addEventListener('click', toggleTheme);

    // Initialize theme from storage or system preference
    const savedTheme = localStorage.getItem('northpac-theme');
    if (savedTheme) {
      setTheme(savedTheme);
    } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      setTheme('dark');
    }

    /* ── Picker ── */
    const stage=document.getElementById('stage');
    const picker=document.querySelector('.proto-picker');
    const highlight=picker.querySelector('.proto-picker-highlight');
    const items=[...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
    const replay=picker?.querySelector('.proto-picker-replay');
    let current=0;
    function moveHighlight(){const el=items[current];highlight.style.width=el.offsetWidth+'px';highlight.style.transform=`translateX(${el.offsetLeft}px)`}
    function mount(i){stage.innerHTML='';requestAnimationFrame(()=>{stage.innerHTML=variants[i]()})}
    function setActive(i){if(i<0||i>=variants.length)return;current=i;items.forEach((el,j)=>{el.toggleAttribute('data-active',j===i);if(j===i)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current')});moveHighlight();const url=new URL(location);url.searchParams.set('v',i+1);history.replaceState(null,'',url);mount(i)}
    items.forEach((el,i)=>el.addEventListener('click',()=>setActive(i)));
    replay?.addEventListener('click',()=>mount(current));
    window.addEventListener('resize',moveHighlight);
    document.addEventListener('keydown',(e)=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable)return;if(e.metaKey||e.ctrlKey||e.altKey)return;const num=parseInt(e.key,10);if(num>=1&&num<=variants.length)setActive(num-1);else if(e.key==='ArrowRight')setActive((current+1)%variants.length);else if(e.key==='ArrowLeft')setActive((current-1+variants.length)%variants.length);else if(e.key==='r'||e.key==='R')mount(current)});
    setActive((parseInt(new URLSearchParams(location.search).get('v'),10)||1)-1);
    requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
  </script>
</body>
</html>
