<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pacific Timber Co — Landing Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── Reset ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Design tokens (OKLCH) ─────────────────────────── */
    :root {
      /* Primary palette — warm brown hue 55 */
      --pt-50:  oklch(0.96 0.01 60);
      --pt-100: oklch(0.88 0.01 55);
      --pt-200: oklch(0.78 0.02 55);
      --pt-300: oklch(0.68 0.04 55);
      --pt-400: oklch(0.60 0.08 45);
      --pt-500: oklch(0.50 0.10 55);
      --pt-600: oklch(0.45 0.09 50);
      --pt-700: oklch(0.38 0.07 50);
      --pt-800: oklch(0.30 0.05 50);
      --pt-900: oklch(0.22 0.03 50);

      /* Semantic — light mode */
      --bg:           oklch(0.96 0.01 60);
      --surface:      oklch(0.93 0.015 55);
      --surface-alt:  oklch(0.90 0.012 55);
      --border:       oklch(0.88 0.01 55);
      --text:         oklch(0.22 0.03 50);
      --text-muted:   oklch(0.45 0.04 55);
      --accent:       oklch(0.50 0.10 55);
      --accent-hover: oklch(0.45 0.09 50);
      --accent-text:  oklch(0.98 0.005 55);

      /* Shadows — 3-layer light */
      --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.06), 0 1px 3px oklch(0 0 0 / 0.04), 0 1px 1px oklch(0 0 0 / 0.03);
      --shadow-md: 0 2px 6px oklch(0 0 0 / 0.08), 0 4px 12px oklch(0 0 0 / 0.05), 0 1px 2px oklch(0 0 0 / 0.04);
      --shadow-lg: 0 4px 12px oklch(0 0 0 / 0.10), 0 8px 24px oklch(0 0 0 / 0.06), 0 2px 4px oklch(0 0 0 / 0.04);

      /* Radii */
      --r-sm: 2px;
      --r-md: 4px;
      --r-lg: 8px;
      --r-xl: 12px;

      /* Spacing */
      --sp-1: 4px;
      --sp-2: 8px;
      --sp-3: 12px;
      --sp-4: 16px;
      --sp-5: 20px;
      --sp-6: 24px;
      --sp-8: 32px;
      --sp-10: 40px;
      --sp-12: 48px;
      --sp-16: 64px;
      --sp-20: 80px;

      /* Transitions */
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    }

    [data-theme="dark"] {
      --bg:           oklch(0.22 0.03 50);
      --surface:      oklch(0.28 0.03 55);
      --surface-alt:  oklch(0.32 0.03 55);
      --border:       oklch(0.35 0.03 55);
      --text:         oklch(0.93 0.01 55);
      --text-muted:   oklch(0.75 0.015 55);
      --accent:       oklch(0.60 0.08 45);
      --accent-hover: oklch(0.68 0.04 55);
      --accent-text:  oklch(0.18 0.03 50);

      /* Shadows — single-ring dark */
      --shadow-sm: 0 0 0 1px oklch(1 0 0 / 0.06);
      --shadow-md: 0 0 0 1px oklch(1 0 0 / 0.08);
      --shadow-lg: 0 0 0 1px oklch(1 0 0 / 0.10);
    }

    /* ── Root typography ───────────────────────────────── */
    html {
      font-family: 'Source Sans 3', 'Source Sans Pro', system-ui, -apple-system, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background 200ms ease-out, color 200ms ease-out;
    }

    h1, h2, h3 {
      font-family: 'Merriweather', Georgia, 'Times New Roman', serif;
      text-wrap: balance;
    }

    body { max-width: 65ch; margin: 0 auto; }

    /* ── Stage ─────────────────────────────────────────── */
    #stage { min-height: 100dvh; }

    /* ── Dark mode toggle ──────────────────────────────── */
    .theme-toggle {
      position: fixed;
      top: var(--sp-5);
      right: var(--sp-5);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: background 150ms ease-out, border-color 150ms ease-out, color 150ms ease-out;
    }
    .theme-toggle:hover { background: var(--surface-alt); }
    .theme-toggle:active { transform: scale(0.96); }
    .theme-toggle svg { width: 20px; height: 20px; }
    .theme-toggle .icon-moon { display: none; }
    [data-theme="dark"] .theme-toggle .icon-sun { display: none; }
    [data-theme="dark"] .theme-toggle .icon-moon { display: block; }

    /* ── Utility classes ───────────────────────────────── */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 var(--sp-6);
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--sp-2);
      padding: var(--sp-3) var(--sp-6);
      border: 0;
      border-radius: var(--r-lg);
      background: var(--accent);
      color: var(--accent-text);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.4;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: background 150ms ease-out, box-shadow 150ms ease-out, transform 100ms ease-out;
    }
    .btn-primary:hover { background: var(--accent-hover); box-shadow: var(--shadow-md); }
    .btn-primary:active { transform: scale(0.96); }
    .btn-primary:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .btn-lg {
      padding: var(--sp-4) var(--sp-8);
      font-size: 1.125rem;
      border-radius: var(--r-xl);
    }

    /* ── Variant-specific shared styles ────────────────── */
    .landing-page {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .logo-mark {
      display: inline-flex;
      align-items: center;
      gap: var(--sp-3);
    }
    .logo-mark svg { width: 40px; height: 40px; flex-shrink: 0; }
    .logo-mark span {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-md);
    }

    .feature-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: var(--r-lg);
      background: var(--pt-50);
      color: var(--accent);
    }
    [data-theme="dark"] .feature-icon {
      background: oklch(0.30 0.04 55);
    }
    .feature-icon svg { width: 24px; height: 24px; }

    .section-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--text);
    }
    .section-subtitle {
      font-size: 1rem;
      line-height: 1.6;
      color: var(--text-muted);
      max-width: 540px;
    }
  </style>
</head>
<body>
  <div id="stage"></div>

  <nav class="proto-picker" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Rustic Strength</button>
    <button class="proto-picker-item">Forest Heritage</button>
    <button class="proto-picker-item">Professional Mill</button>
  </nav>

  <script>
    /* ── Dark mode toggle ──────────────────────────────── */
    function toggleTheme() {
      const html = document.documentElement;
      const next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      html.setAttribute('data-theme', next);
      localStorage.setItem('pacific-timber-theme', next);
    }

    /* ── Theme init from storage or system ─────────────── */
    (function initTheme() {
      const saved = localStorage.getItem('pacific-timber-theme');
      if (saved) {
        document.documentElement.setAttribute('data-theme', saved);
      } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();

    /* ── SVG logo (inline tree icon) ───────────────────── */
    const treeLogo = `<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 4 L10 18 L14 18 L8 28 L32 28 L26 18 L30 18 Z" fill="currentColor" opacity="0.85"/>
      <rect x="18" y="28" width="4" height="8" rx="1" fill="currentColor" opacity="0.65"/>
    </svg>`;

    const themeToggle = `
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>`;

    /* ── Feature icons ─────────────────────────────────── */
    const iconSeedling = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V8"/><path d="M5 12H2a10 10 0 0 0 10-10v0a10 10 0 0 1 10 10h-3"/><path d="M8 20h8"/></svg>`;
    const iconTree = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-7"/><path d="M8 22h8"/><path d="M12 15l-4-5h8l-4 5z"/><path d="M12 11l-3-4h6l-3 4z"/></svg>`;
    const iconTruck = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 3h15v13H1z"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>`;
    const iconSaw = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4l-4 4 4 4"/><path d="M10 4l4 4-4 4"/><line x1="4" y1="20" x2="20" y2="4"/></svg>`;

    /* ── Variants ──────────────────────────────────────── */
    const variants = [

      /* ═══════════════════════════════════════════════════
         Variant 1 — Rustic Strength
         Axis: dark wood-tone gradient, geometric timber
         decorators, bold serif headings, stats proof
         ═══════════════════════════════════════════════════ */
      function variant1() {
        return `
          <div class="landing-page" style="
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
          ">
            ${themeToggle}

            <!-- Dark wood-tone gradient backdrop -->
            <div style="
              position: absolute;
              inset: 0;
              background:
                linear-gradient(165deg, oklch(0.30 0.08 55) 0%, oklch(0.25 0.06 50) 35%, oklch(0.22 0.04 45) 70%, oklch(0.20 0.03 50) 100%);
              pointer-events: none;
            "></div>

            <!-- Geometric timber decorators -->
            <div style="
              position: absolute;
              top: 10%;
              left: 5%;
              width: 120px;
              height: 120px;
              border: 2px solid oklch(0.60 0.08 45 / 0.15);
              border-radius: var(--r-sm);
              transform: rotate(45deg);
              pointer-events: none;
            " aria-hidden="true"></div>
            <div style="
              position: absolute;
              bottom: 15%;
              right: 8%;
              width: 80px;
              height: 80px;
              background: oklch(0.60 0.08 45 / 0.08);
              border-radius: var(--r-sm);
              pointer-events: none;
            " aria-hidden="true"></div>
            <div style="
              position: absolute;
              top: 25%;
              right: 12%;
              width: 0;
              height: 0;
              border-left: 40px solid transparent;
              border-right: 40px solid transparent;
              border-bottom: 70px solid oklch(0.60 0.08 45 / 0.06);
              pointer-events: none;
            " aria-hidden="true"></div>
            <!-- Growth ring circles -->
            <div style="
              position: absolute;
              bottom: 30%;
              left: 10%;
              width: 160px;
              height: 160px;
              border: 1px solid oklch(0.60 0.08 45 / 0.08);
              border-radius: 50%;
              pointer-events: none;
            " aria-hidden="true"></div>
            <div style="
              position: absolute;
              bottom: calc(30% + 20px);
              left: calc(10% + 20px);
              width: 120px;
              height: 120px;
              border: 1px solid oklch(0.60 0.08 45 / 0.06);
              border-radius: 50%;
              pointer-events: none;
            " aria-hidden="true"></div>
            <div style="
              position: absolute;
              bottom: calc(30% + 40px);
              left: calc(10% + 40px);
              width: 80px;
              height: 80px;
              border: 1px solid oklch(0.60 0.08 45 / 0.04);
              border-radius: 50%;
              pointer-events: none;
            " aria-hidden="true"></div>

            <!-- Card -->
            <div style="
              position: relative;
              z-index: 1;
              display: flex;
              flex-direction: column;
              align-items: center;
              text-align: center;
              gap: var(--sp-8);
              padding: var(--sp-16) var(--sp-10);
              max-width: 560px;
              width: 100%;
              background: oklch(1 0 0 / 0.04);
              backdrop-filter: blur(20px) saturate(1.2);
              -webkit-backdrop-filter: blur(20px) saturate(1.2);
              border: 1px solid oklch(1 0 0 / 0.08);
              border-radius: var(--r-xl);
            ">
              <div style="color: oklch(0.88 0.01 55);">
                ${treeLogo}
              </div>
              <div style="display: flex; flex-direction: column; gap: var(--sp-2);">
                <span style="
                  font-family: 'Merriweather', Georgia, serif;
                  font-size: 0.875rem;
                  font-weight: 700;
                  color: oklch(0.88 0.01 55);
                  letter-spacing: 0.08em;
                  text-transform: uppercase;
                ">Pacific Timber Co</span>
              </div>

              <h1 style="
                font-family: 'Merriweather', Georgia, serif;
                font-size: clamp(2rem, 5vw, 3rem);
                font-weight: 900;
                letter-spacing: -0.03em;
                line-height: 1.15;
                color: oklch(0.96 0.005 55);
                max-width: 480px;
              ">Built From the Ground Up</h1>

              <p style="
                font-size: 1.125rem;
                line-height: 1.6;
                color: oklch(0.80 0.01 55 / 0.8);
                max-width: 400px;
              ">Silviculture to finished lumber. Five decades of harvesting the Pacific Northwest's finest timber.</p>

              <!-- Stats proof -->
              <div style="
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: var(--sp-6);
                width: 100%;
                max-width: 400px;
                margin-top: var(--sp-2);
              ">
                <div style="display: flex; flex-direction: column; align-items: center; gap: var(--sp-1);">
                  <span style="font-family:'Merriweather',Georgia,serif; font-size: 1.5rem; font-weight: 900; color: oklch(0.96 0.005 55);">50+</span>
                  <span style="font-size: 0.75rem; color: oklch(0.75 0.01 55 / 0.7); text-transform: uppercase; letter-spacing: 0.06em;">Years</span>
                </div>
                <div style="display: flex; flex-direction: column; align-items: center; gap: var(--sp-1);">
                  <span style="font-family:'Merriweather',Georgia,serif; font-size: 1.5rem; font-weight: 900; color: oklch(0.96 0.005 55);">10M</span>
                  <span style="font-size: 0.75rem; color: oklch(0.75 0.01 55 / 0.7); text-transform: uppercase; letter-spacing: 0.06em;">Board Feet</span>
                </div>
                <div style="display: flex; flex-direction: column; align-items: center; gap: var(--sp-1);">
                  <span style="font-family:'Merriweather',Georgia,serif; font-size: 1.5rem; font-weight: 900; color: oklch(0.96 0.005 55);">200+</span>
                  <span style="font-size: 0.75rem; color: oklch(0.75 0.01 55 / 0.7); text-transform: uppercase; letter-spacing: 0.06em;">Employees</span>
                </div>
              </div>

              <button class="btn-primary btn-lg" style="
                margin-top: var(--sp-4);
                background: oklch(0.60 0.08 45);
                color: oklch(0.98 0.005 55);
                text-transform: uppercase;
                letter-spacing: 0.05em;
                font-weight: 700;
              ">
                Request a Quote
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
              </button>
            </div>

            <!-- Footer -->
            <p style="
              position: relative;
              z-index: 1;
              margin-top: var(--sp-8);
              font-size: 0.8125rem;
              color: oklch(0.70 0.01 55 / 0.6);
            ">&copy; Pacific Timber Co</p>
          </div>`;
      },

      /* ═══════════════════════════════════════════════════
         Variant 2 — Forest Heritage
         Axis: soft green-cream gradient, organic leaf
         decorators, features grid, warm inviting tone
         ═══════════════════════════════════════════════════ */
      function variant2() {
        return `
          <div class="landing-page" style="
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
          ">
            ${themeToggle}

            <!-- Hero section -->
            <section style="
              display: flex;
              flex-direction: column;
              align-items: center;
              text-align: center;
              padding: var(--sp-20) var(--sp-6) var(--sp-16);
              position: relative;
              overflow: hidden;
              background: linear-gradient(145deg, oklch(0.94 0.02 80) 0%, oklch(0.96 0.015 70) 50%, oklch(0.92 0.025 75) 100%);
            ">
              <div style="
                position: absolute;
                inset: 0;
                background: radial-gradient(ellipse 70% 50% at 50% 30%, oklch(0.50 0.10 55 / 0.06), transparent);
                pointer-events: none;
              "></div>

              <!-- Organic leaf decorators -->
              <div style="
                position: absolute;
                top: 8%;
                left: 8%;
                width: 100px;
                height: 100px;
                background: oklch(0.50 0.10 55);
                border-radius: 0 80% 0 80%;
                transform: rotate(-30deg);
                opacity: 0.08;
                pointer-events: none;
              " aria-hidden="true"></div>
              <div style="
                position: absolute;
                bottom: 12%;
                right: 6%;
                width: 70px;
                height: 70px;
                background: oklch(0.60 0.08 45);
                border-radius: 80% 0 80% 0;
                transform: rotate(20deg);
                opacity: 0.10;
                pointer-events: none;
              " aria-hidden="true"></div>
              <div style="
                position: absolute;
                top: 20%;
                right: 15%;
                width: 50px;
                height: 50px;
                background: oklch(0.55 0.09 50);
                border-radius: 50% 0 50% 0;
                transform: rotate(45deg);
                opacity: 0.06;
                pointer-events: none;
              " aria-hidden="true"></div>
              <div style="
                position: absolute;
                bottom: 25%;
                left: 12%;
                width: 40px;
                height: 40px;
                background: oklch(0.50 0.10 55);
                border-radius: 0 50% 0 50%;
                transform: rotate(-15deg);
                opacity: 0.05;
                pointer-events: none;
              " aria-hidden="true"></div>

              <div style="position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: var(--sp-6);">
                <div class="logo-mark">
                  <div style="color: var(--accent);">${treeLogo}</div>
                  <span>Pacific Timber Co</span>
                </div>

                <h1 style="
                  font-family: 'Merriweather', Georgia, serif;
                  font-size: clamp(1.75rem, 4vw, 2.5rem);
                  font-weight: 700;
                  letter-spacing: -0.03em;
                  line-height: 1.2;
                  color: var(--text);
                  max-width: 520px;
                ">Rooted in the Pacific Northwest</h1>

                <p style="
                  font-size: 1.0625rem;
                  line-height: 1.6;
                  color: var(--text-muted);
                  max-width: 440px;
                ">From seedling to sawmill, we deliver quality lumber with sustainable practices that honor the forest.</p>

                <button class="btn-primary" style="margin-top: var(--sp-2);">
                  Explore Our Services
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                </button>
              </div>
            </section>

            <!-- Features grid -->
            <section style="
              padding: var(--sp-16) var(--sp-6);
              background: var(--surface);
              border-top: 1px solid var(--border);
              border-bottom: 1px solid var(--border);
            ">
              <div class="container" style="display: flex; flex-direction: column; align-items: center; gap: var(--sp-12);">
                <div style="text-align: center; display: flex; flex-direction: column; align-items: center; gap: var(--sp-3);">
                  <h2 class="section-title">Our Services</h2>
                  <p class="section-subtitle" style="text-align: center;">Full vertical integration from seed to finished lumber, serving British Columbia's forestry needs.</p>
                </div>

                <div style="
                  display: grid;
                  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
                  gap: var(--sp-6);
                  width: 100%;

      /* ═══════════════════════════════════════════════════
         Variant 3 — Professional Mill

         ═══════════════════════════════════════════════════ */
      function variant3() {
        return `

            min-height: 100dvh;

                width: 48px;

              <h1 style="
                font-family: 'Merriweather', Georgia, serif;
                font-size: 1.5rem;
                font-weight: 700;
                letter-spacing: -0.02em;
                line-height: 1.3;
                color: var(--text);
              ">Welcome to Pacific Timber Co</h1>

              <p style="
                font-size: 1rem;
                line-height: 1.6;
                color: var(--text-muted);
                max-width: 340px;
              ">Silviculture, logging, hauling, milling, and seeding. Your trusted partner in British Columbia forestry.</p>

              <!-- Service grid -->
              <div style="
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: var(--sp-3);
                width: 100%;
                max-width: 340px;
                margin: var(--sp-2) 0;
              ">
                <div style="
                  display: flex;
                  align-items: center;
                  gap: var(--sp-2);
                  padding: var(--sp-2) var(--sp-3);
                  border-radius: var(--r-md);
                  background: var(--surface);
                  color: var(--text-muted);
                  font-size: 0.875rem;
                  font-weight: 600;
                  border: 1px solid var(--border);
                ">
                  <span style="color: var(--accent); flex-shrink: 0;">${iconSeedling}</span>
                  Silviculture
                </div>
                <div style="
                  display: flex;
                  align-items: center;
                  gap: var(--sp-2);
                  padding: var(--sp-2) var(--sp-3);
                  border-radius: var(--r-md);
                  background: var(--surface);
                  color: var(--text-muted);
                  font-size: 0.875rem;
                  font-weight: 600;
                  border: 1px solid var(--border);
                ">
                  <span style="color: var(--accent); flex-shrink: 0;">${iconTree}</span>
                  Logging
                </div>
                <div style="
                  display: flex;
                  align-items: center;
                  gap: var(--sp-2);
                  padding: var(--sp-2) var(--sp-3);
                  border-radius: var(--r-md);
                  background: var(--surface);

                  font-size: 0.875rem;

                  border: 1px solid var(--border);
                ">
                  <span style="color: var(--accent); flex-shrink: 0;">${iconTruck}</span>
                  Hauling
                </div>
                <div style="
                  display: flex;
                  align-items: center;
                  gap: var(--sp-2);
                  padding: var(--sp-2) var(--sp-3);
                  border-radius: var(--r-md);
                  background: var(--surface);
                  color: var(--text-muted);
                  font-size: 0.875rem;
                  font-weight: 600;
                  border: 1px solid var(--border);
                ">
                  <span style="color: var(--accent); flex-shrink: 0;">${iconSaw}</span>
                  Milling
                </div>
              </div>

              <button class="btn-primary" style="margin-top: var(--sp-4);">
                Contact Us
              </button>

              <p style="

              ">&copy; Pacific Timber Co</p>
            </div>
          </div>`;
      }
    ];

    /* ── Picker wiring (verbatim) ──────────────────────── */
    const stage = document.getElementById('stage');
    const picker = document.querySelector('.proto-picker');
    const highlight = picker.querySelector('.proto-picker-highlight');
    const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
    const replay = picker.querySelector('.proto-picker-replay');
    let current = 0;

    function moveHighlight() {
      const el = items[current];
      highlight.style.width = el.offsetWidth + 'px';
      highlight.style.transform = `translateX(${el.offsetLeft}px)`;
    }

    function mount(i) {
      stage.innerHTML = '';
      requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
    }

    function setActive(i) {
      if (i < 0 || i >= variants.length) return;
      current = i;
      items.forEach((el, j) => {
        el.toggleAttribute('data-active', j === i);
        if (j === i) el.setAttribute('aria-current', 'true');
        else el.removeAttribute('aria-current');
      });
      moveHighlight();
      const url = new URL(location);
      url.searchParams.set('v', i + 1);
      history.replaceState(null, '', url);
      mount(i);
    }

    items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
    replay?.addEventListener('click', () => mount(current));
    window.addEventListener('resize', moveHighlight);

    document.addEventListener('keydown', (e) => {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const num = parseInt(e.key, 10);
      if (num >= 1 && num <= variants.length) setActive(num - 1);
      else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
      else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
      else if (e.key === 'r' || e.key === 'R') mount(current);
    });

    setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
    requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
  </script>
