<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pacific Timber Co — Dashboard Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-primary: oklch(0.50 0.10 55);
      --color-primary-hover: oklch(0.45 0.11 55);
      --color-primary-light: oklch(0.92 0.04 55);
      --color-primary-muted: oklch(0.70 0.08 55);

      --color-secondary: oklch(0.60 0.08 45);
      --color-accent: oklch(0.55 0.09 50);

      --color-success: oklch(0.62 0.14 155);
      --color-warning: oklch(0.75 0.15 75);
      --color-danger: oklch(0.58 0.18 25);
      --color-info: oklch(0.60 0.10 240);

      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --space-10: 2.5rem;
      --space-12: 3rem;
      --space-16: 4rem;

      --radius-sm: 2px;
      --radius-md: 4px;
      --radius-lg: 8px;
      --radius-xl: 12px;
      --radius-full: 999px;

      --shadow-sm: 0 1px 2px oklch(0.2 0.03 50 / 0.06);
      --shadow-md: 0 2px 8px oklch(0.2 0.03 50 / 0.08), 0 1px 2px oklch(0.2 0.03 50 / 0.04);
      --shadow-lg: 0 4px 16px oklch(0.2 0.03 50 / 0.10), 0 2px 4px oklch(0.2 0.03 50 / 0.06), 0 1px 2px oklch(0.2 0.03 50 / 0.04);

      --header-height: 3rem;
      --sidebar-width: 16rem;
      --sidebar-collapsed-width: 3.5rem;

      --font-heading: 'Merriweather', Georgia, 'Times New Roman', serif;
      --font-family: 'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-size-xs: 0.75rem;
      --font-size-sm: 0.875rem;
      --font-size-base: 1rem;
      --font-size-lg: 1.125rem;
      --font-size-xl: 1.25rem;
      --font-size-2xl: 1.5rem;
      --font-size-3xl: 2rem;
      --font-size-4xl: 2.5rem;
      --line-height-tight: 1.2;
      --line-height-normal: 1.5;
      --line-height-relaxed: 1.65;
    }

    /* Light theme */
    [data-theme="light"] {
      --bg: oklch(0.96 0.01 60);
      --surface: oklch(0.93 0.015 55);
      --surface-raised: oklch(1.0 0 0);
      --surface-overlay: oklch(0.96 0.01 60);
      --header-bg: oklch(1.0 0 0);
      --sidebar-bg: oklch(0.95 0.01 60);
      --text-primary: oklch(0.22 0.03 50);
      --text-secondary: oklch(0.45 0.04 55);
      --text-tertiary: oklch(0.58 0.03 55);
      --border-color: oklch(0.88 0.01 55);
      --border-subtle: oklch(0.93 0.008 55);
      --hover-bg: oklch(0.95 0.008 55);
      --active-bg: oklch(0.92 0.012 55);
      --focus-ring: oklch(0.50 0.10 55 / 0.35);
      --nav-active-bg: oklch(0.92 0.04 55);
      --nav-active-text: oklch(0.40 0.12 55);
      --badge-bg: oklch(0.93 0.03 55);
      --badge-text: oklch(0.40 0.12 55);
      --scrollbar-track: oklch(0.95 0.005 55);
      --scrollbar-thumb: oklch(0.85 0.01 55);
    }

    /* Dark theme */
    [data-theme="dark"] {
      --bg: oklch(0.22 0.03 50);
      --surface: oklch(0.28 0.03 55);
      --surface-raised: oklch(0.32 0.03 55);
      --surface-overlay: oklch(0.25 0.03 50);
      --header-bg: oklch(0.24 0.03 50);
      --sidebar-bg: oklch(0.23 0.03 50);
      --text-primary: oklch(0.93 0.01 55);
      --text-secondary: oklch(0.75 0.015 55);
      --text-tertiary: oklch(0.58 0.015 55);
      --border-color: oklch(0.35 0.03 55);
      --border-subtle: oklch(0.30 0.025 55);
      --hover-bg: oklch(0.30 0.03 55);
      --active-bg: oklch(0.34 0.03 55);
      --focus-ring: oklch(0.50 0.10 55 / 0.5);
      --nav-active-bg: oklch(0.30 0.06 55);
      --nav-active-text: oklch(0.78 0.12 55);
      --badge-bg: oklch(0.30 0.06 55);
      --badge-text: oklch(0.80 0.12 55);
      --shadow-sm: none;
      --shadow-md: 0 0 0 1px oklch(0.38 0.025 55);
      --shadow-lg: 0 0 0 1px oklch(0.35 0.025 55);
      --scrollbar-track: oklch(0.24 0.025 55);
      --scrollbar-thumb: oklch(0.35 0.025 55);
    }

    html {
      font-family: var(--font-family);
      font-size: 16px;
      line-height: var(--line-height-normal);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      color: var(--text-primary);
      background: var(--bg);
    }

    body { min-height: 100vh; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: var(--radius-full); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }

    /* ─── Layout shell ─── */
    .shell { display: flex; min-height: 100vh; }

    /* ─── Sidebar ─── */
    .sidebar {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: var(--sidebar-width);
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      z-index: 100;
      transition: width 200ms ease-out, transform 200ms ease-out;
      overflow: hidden;
    }
    .sidebar.collapsed { width: var(--sidebar-collapsed-width); }
    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      height: var(--header-height);
      padding: 0 var(--space-4);
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }
    .sidebar-brand-icon {
      width: 28px; height: 28px;
      border-radius: var(--radius-md);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-primary);
    }
    .sidebar-brand-icon svg { width: 16px; height: 16px; fill: oklch(1.0 0 0); }
    .sidebar-brand-text {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: var(--font-size-sm);
      white-space: nowrap;
      overflow: hidden;
      transition: opacity 150ms ease-out;
      color: var(--text-primary);
    }
    .sidebar.collapsed .sidebar-brand-text { opacity: 0; width: 0; }

    .sidebar-nav { flex: 1; padding: var(--space-3) var(--space-2); overflow-y: auto; }
    .sidebar-nav-item {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      text-decoration: none;
      font-size: var(--font-size-sm);
      font-weight: 600;
      cursor: pointer;
      transition: background 120ms ease-out, color 120ms ease-out;
      white-space: nowrap;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }
    .sidebar-nav-item:hover { background: var(--hover-bg); color: var(--text-primary); }
    .sidebar-nav-item.active { background: var(--nav-active-bg); color: var(--nav-active-text); }
    .sidebar-nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
    .sidebar-nav-item-label { overflow: hidden; transition: opacity 150ms ease-out; }
    .sidebar.collapsed .sidebar-nav-item-label { opacity: 0; width: 0; }

    .sidebar-section-label {
      font-size: var(--font-size-xs);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-tertiary);
      padding: var(--space-4) var(--space-3) var(--space-2);
      white-space: nowrap;
      overflow: hidden;
    }
    .sidebar.collapsed .sidebar-section-label { opacity: 0; }

    .sidebar-footer {
      padding: var(--space-3);
      border-top: 1px solid var(--border-color);
    }

    /* ─── Main wrapper ─── */
    .main-wrapper {
      flex: 1;
      margin-left: var(--sidebar-width);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      transition: margin-left 200ms ease-out;
    }
    .sidebar.collapsed ~ .main-wrapper { margin-left: var(--sidebar-collapsed-width); }

    /* ─── Header ─── */
    .header {
      position: sticky;
      top: 0;
      height: var(--header-height);
      background: var(--header-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      padding: 0 var(--space-6);
      gap: var(--space-4);
      z-index: 90;
      box-shadow: var(--shadow-sm);
    }
    .header-hamburger {
      display: flex; align-items: center; justify-content: center;
      width: 32px; height: 32px;
      border: none; background: none;
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      cursor: pointer;
      transition: background 120ms ease-out;
    }
    .header-hamburger:hover { background: var(--hover-bg); }
    .header-hamburger svg { width: 20px; height: 20px; }

    .header-title {
      font-family: var(--font-heading);
      font-size: var(--font-size-base);
      font-weight: 700;
      color: var(--text-primary);
    }
    .header-spacer { flex: 1; }

    .header-actions { display: flex; align-items: center; gap: var(--space-2); }

    .icon-btn {
      display: flex; align-items: center; justify-content: center;
      width: 36px; height: 36px;
      border: none; background: none;
      border-radius: var(--radius-full);
      color: var(--text-secondary);
      cursor: pointer;
      transition: background 120ms ease-out, color 120ms ease-out;
    }
    .icon-btn:hover { background: var(--hover-bg); color: var(--text-primary); }
    .icon-btn:active { transform: scale(0.96); }
    .icon-btn svg { width: 20px; height: 20px; }

    .avatar {
      width: 32px; height: 32px;
      border-radius: var(--radius-full);
      background: var(--color-primary);
      color: oklch(1.0 0 0);
      display: flex; align-items: center; justify-content: center;
      font-size: var(--font-size-sm);
      font-weight: 700;
      flex-shrink: 0;
    }

    /* ─── Content ─── */
    .content {
      flex: 1;
      padding: var(--space-8);
      max-width: 72ch;
    }
    .content-wide { max-width: none; }

    /* ─── Typography ─── */
    h1 { font-family: var(--font-heading); font-size: var(--font-size-3xl); font-weight: 700; line-height: var(--line-height-tight); color: var(--text-primary); text-wrap: balance; }
    h2 { font-family: var(--font-heading); font-size: var(--font-size-2xl); font-weight: 700; line-height: var(--line-height-tight); color: var(--text-primary); text-wrap: balance; }
    h3 { font-family: var(--font-heading); font-size: var(--font-size-xl); font-weight: 700; line-height: var(--line-height-tight); color: var(--text-primary); text-wrap: balance; }
    h4 { font-family: var(--font-heading); font-size: var(--font-size-lg); font-weight: 700; line-height: var(--line-height-tight); color: var(--text-primary); text-wrap: balance; }
    p { line-height: var(--line-height-relaxed); color: var(--text-secondary); max-width: 65ch; }

    /* ─── Cards ─── */
    .card {
      background: var(--surface-raised);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: var(--space-6);
      box-shadow: var(--shadow-sm);
      transition: box-shadow 150ms ease-out, transform 150ms ease-out;
    }
    .card:hover { box-shadow: var(--shadow-md); }

    /* ─── Badge ─── */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: var(--space-1) var(--space-3);
      border-radius: var(--radius-full);
      font-size: var(--font-size-xs);
      font-weight: 600;
      background: var(--badge-bg);
      color: var(--badge-text);
    }
    .badge-success { background: oklch(0.90 0.05 155); color: oklch(0.38 0.12 155); }
    .badge-warning { background: oklch(0.92 0.06 75); color: oklch(0.42 0.12 75); }
    .badge-danger { background: oklch(0.90 0.06 25); color: oklch(0.45 0.14 25); }
    .badge-info { background: oklch(0.90 0.04 240); color: oklch(0.42 0.10 240); }

    /* ─── Button ─── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      height: 2.5rem;
      padding: 0 var(--space-3);
      border: none;
      border-radius: var(--radius-md);
      font-family: var(--font-family);
      font-size: var(--font-size-sm);
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: background 120ms ease-out, transform 100ms ease-out;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: var(--color-primary); color: oklch(1.0 0 0); }
    .btn-primary:hover { background: var(--color-primary-hover); }
    .btn svg { width: 16px; height: 16px; flex-shrink: 0; }
    .btn-outline { background: transparent; color: var(--text-primary); border: 1px solid var(--border-color); }
    .btn-outline:hover { background: var(--hover-bg); }

    /* ─── Grid helpers ─── */
    .grid { display: grid; gap: var(--space-4); }
    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-4 { grid-template-columns: repeat(4, 1fr); }

    /* ─── Section ─── */
    .section { margin-bottom: var(--space-8); }
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-4); }

    /* ─── Footer ─── */
    .footer {
      padding: var(--space-4) var(--space-6);
      border-top: 1px solid var(--border-color);
      font-size: var(--font-size-xs);
      color: var(--text-tertiary);
      text-align: center;
    }

    /* ─── Status dot ─── */
    .status-dot {
      width: 8px; height: 8px;
      border-radius: var(--radius-full);
      display: inline-block;
      flex-shrink: 0;
    }
    .status-dot-active { background: var(--color-success); }
    .status-dot-pending { background: var(--color-warning); }
    .status-dot-inactive { background: var(--text-tertiary); }

    /* ─── Progress ring ─── */
    .progress-ring { transform: rotate(-90deg); }
    .progress-ring-bg { fill: none; stroke: var(--border-color); }
    .progress-ring-fill { fill: none; stroke-linecap: round; transition: stroke-dashoffset 600ms ease-out; }

    /* ─── Responsive ─── */
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); width: var(--sidebar-width); }
      .sidebar.mobile-open { transform: translateX(0); }
      .main-wrapper { margin-left: 0 !important; }
      .grid-3 { grid-template-columns: 1fr; }
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
      .content { padding: var(--space-4); }
    }
    @media (min-width: 769px) and (max-width: 1024px) {
      .grid-3 { grid-template-columns: repeat(2, 1fr); }
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
    }

    /* ─── Variant 1: Timber Map Operations ─── */
    .ops-map-hero {
      position: relative;
      height: 320px;
      background: var(--surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-bottom: var(--space-6);
    }
    .ops-map-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(var(--border-subtle) 1px, transparent 1px),
        linear-gradient(90deg, var(--border-subtle) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.6;
    }
    .ops-map-block {
      position: absolute;
      border-radius: var(--radius-md);
      border: 2px solid;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--font-size-xs);
      font-weight: 700;
      cursor: pointer;
      transition: transform 120ms ease-out, box-shadow 120ms ease-out;
    }
    .ops-map-block:hover { transform: scale(1.05); box-shadow: var(--shadow-md); }
    .ops-map-block.active { background: oklch(0.62 0.14 155 / 0.2); border-color: var(--color-success); color: oklch(0.38 0.12 155); }
    .ops-map-block.harvesting { background: oklch(0.75 0.15 75 / 0.2); border-color: var(--color-warning); color: oklch(0.42 0.12 75); }
    .ops-map-block.dormant { background: oklch(0.58 0.03 55 / 0.1); border-color: var(--text-tertiary); color: var(--text-tertiary); }

    .ops-block-list-item {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-4);
      border-bottom: 1px solid var(--border-subtle);
      font-size: var(--font-size-sm);
      cursor: pointer;
      transition: background 120ms ease-out;
    }
    .ops-block-list-item:hover { background: var(--hover-bg); }
    .ops-block-list-item:last-child { border-bottom: none; }
    .ops-block-id { font-weight: 700; color: var(--text-primary); min-width: 4rem; }
    .ops-block-coords { color: var(--text-tertiary); font-size: var(--font-size-xs); font-variant-numeric: tabular-nums; }

    .ops-activity-row {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-2) 0;
      border-bottom: 1px solid var(--border-subtle);
      font-size: var(--font-size-sm);
    }
    .ops-activity-row:last-child { border-bottom: none; }
    .ops-activity-time { color: var(--text-tertiary); font-size: var(--font-size-xs); white-space: nowrap; min-width: 5rem; }
    .ops-activity-text { color: var(--text-secondary); flex: 1; }

    /* ─── Variant 2: Fleet & Forestry ─── */
    .fleet-card {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      padding: var(--space-4);
    }
    .fleet-icon {
      width: 44px; height: 44px;
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .fleet-icon svg { width: 22px; height: 22px; }
    .fleet-info { flex: 1; }
    .fleet-name { font-weight: 700; font-size: var(--font-size-sm); color: var(--text-primary); }
    .fleet-meta { font-size: var(--font-size-xs); color: var(--text-tertiary); margin-top: 2px; }

    .block-grid-item {
      padding: var(--space-4);
      border-left: 3px solid;
      cursor: pointer;
      transition: background 120ms ease-out;
    }
    .block-grid-item:hover { background: var(--hover-bg); }
    .block-grid-item.status-active { border-color: var(--color-success); }
    .block-grid-item.status-dormant { border-color: var(--text-tertiary); }
    .block-grid-item.status-harvested { border-color: var(--color-warning); }

    .quick-action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-5) var(--space-3);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      background: var(--surface-raised);
      color: var(--text-primary);
      font-family: var(--font-family);
      font-size: var(--font-size-sm);
      font-weight: 600;
      cursor: pointer;
      transition: background 120ms ease-out, border-color 120ms ease-out, transform 100ms ease-out;
      text-align: center;
    }
    .quick-action-btn:hover { background: var(--hover-bg); border-color: var(--color-primary); }
    .quick-action-btn:active { transform: scale(0.96); }
    .quick-action-icon { font-size: var(--font-size-2xl); }

    /* ─── Variant 3: Mill Operations ─── */
    .mill-metric {
      text-align: center;
      padding: var(--space-5);
    }
    .mill-metric-value {
      font-family: var(--font-heading);
      font-size: var(--font-size-4xl);
      font-weight: 700;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .mill-metric-label {
      font-size: var(--font-size-xs);
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
      margin-top: var(--space-2);
    }

    .mill-grade-bar {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-2) 0;
    }
    .mill-grade-label { font-size: var(--font-size-sm); color: var(--text-secondary); min-width: 5rem; }
    .mill-grade-track {
      flex: 1;
      height: 8px;
      background: var(--border-color);
      border-radius: var(--radius-full);
      overflow: hidden;
    }
    .mill-grade-fill {
      height: 100%;
      border-radius: var(--radius-full);
      transition: width 600ms ease-out;
    }
    .mill-grade-value { font-size: var(--font-size-sm); font-weight: 600; color: var(--text-primary); min-width: 3rem; text-align: right; font-variant-numeric: tabular-nums; }

    .mill-schedule-day {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3) 0;
      border-bottom: 1px solid var(--border-subtle);
    }
    .mill-schedule-day:last-child { border-bottom: none; }

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  if (sb) sb.classList.toggle('collapsed');
}

function toggleTheme() {
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  html.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
}

(function initTheme() {
  try {
    const stored = localStorage.getItem('theme');
    if (stored) { document.documentElement.setAttribute('data-theme', stored); return; }
  } catch(e) {}
  if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();

/* ═══════════════════════════════════════════
   PICKER WIRING
   ═══════════════════════════════════════════ */
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker?.querySelector('.proto-picker-replay');
let current = 0;

const variants = [variant1, variant2, variant3];

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
