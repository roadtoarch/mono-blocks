<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Summit Athletics — Landing Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ── Reset ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Design tokens (OKLCH) ─────────────────────────── */
    :root {
      /* Primary palette — teal hue ~178 */
      --sa-50:  oklch(0.96 0.015 178);
      --sa-100: oklch(0.89 0.04 178);
      --sa-200: oklch(0.80 0.06 176);
      --sa-300: oklch(0.70 0.08 175);
      --sa-400: oklch(0.60 0.08 170);
      --sa-500: oklch(0.55 0.09 175);
      --sa-600: oklch(0.50 0.10 178);
      --sa-700: oklch(0.42 0.08 178);
      --sa-800: oklch(0.34 0.05 178);
      --sa-900: oklch(0.25 0.035 178);

      /* Semantic — light mode */
      --bg:           oklch(0.97 0.005 80);
      --surface:      oklch(0.94 0.01 80);
      --surface-alt:  oklch(0.91 0.012 80);
      --border:       oklch(0.89 0.008 80);
      --text:         oklch(0.18 0.02 180);
      --text-muted:   oklch(0.45 0.03 178);
      --accent:       var(--sa-500);
      --accent-hover: var(--sa-600);
      --accent-text:  oklch(1 0 0);

      /* Shadows — 3-layer light */
      --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.05), 0 1px 3px oklch(0 0 0 / 0.03), 0 1px 1px oklch(0 0 0 / 0.02);
      --shadow-md: 0 2px 6px oklch(0 0 0 / 0.07), 0 4px 12px oklch(0 0 0 / 0.04), 0 1px 2px oklch(0 0 0 / 0.03);
      --shadow-lg: 0 4px 12px oklch(0 0 0 / 0.09), 0 8px 24px oklch(0 0 0 / 0.05), 0 2px 4px oklch(0 0 0 / 0.03);

      /* Radii */
      --r-sm: 2px;
      --r-md: 4px;
      --r-lg: 8px;
      --r-xl: 12px;

      /* Spacing */
      --sp-1: 4px;
      --sp-2: 8px;
      --sp-3: 12px;
      --sp-4: 16px;
      --sp-5: 20px;
      --sp-6: 24px;
      --sp-8: 32px;
      --sp-10: 40px;
      --sp-12: 48px;
      --sp-16: 64px;
      --sp-20: 80px;

      /* Transitions */
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    }

    [data-theme="dark"] {
      --bg:           oklch(0.20 0.03 180);
      --surface:      oklch(0.26 0.03 175);
      --surface-alt:  oklch(0.30 0.028 178);
      --border:       oklch(0.34 0.025 178);
      --text:         oklch(0.94 0.008 80);
      --text-muted:   oklch(0.75 0.015 178);
      --accent:       var(--sa-400);
      --accent-hover: var(--sa-300);
      --accent-text:  oklch(0.18 0.02 180);

      /* Shadows — single-ring dark */
      --shadow-sm: 0 0 0 1px oklch(1 0 0 / 0.06);
      --shadow-md: 0 0 0 1px oklch(1 0 0 / 0.08);
      --shadow-lg: 0 0 0 1px oklch(1 0 0 / 0.10);
    }

    /* ── Root typography ───────────────────────────────── */
    html {
      font-family: 'Outfit', system-ui, -apple-system, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      font-smooth: antialiased;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background 200ms ease-out, color 200ms ease-out;
    }

    /* ── Stage ─────────────────────────────────────────── */
    #stage { min-height: 100dvh; }

    /* ── Dark mode toggle ──────────────────────────────── */
    .theme-toggle {
      position: fixed;
      top: var(--sp-5);
      right: var(--sp-5);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: background 150ms ease-out, border-color 150ms ease-out, color 150ms ease-out;
    }
    .theme-toggle:hover { background: var(--surface-alt); }
    .theme-toggle:active { transform: scale(0.96); }
    .theme-toggle svg { width: 20px; height: 20px; }
    .theme-toggle .icon-moon { display: none; }
    [data-theme="dark"] .theme-toggle .icon-sun { display: none; }
    [data-theme="dark"] .theme-toggle .icon-moon { display: block; }

    /* ── Utility classes ───────────────────────────────── */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 var(--sp-6);
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--sp-2);
      padding: var(--sp-3) var(--sp-6);
      border: 0;
      border-radius: var(--r-lg);
      background: var(--accent);
      color: var(--accent-text);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.4;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: background 150ms ease-out, box-shadow 150ms ease-out, transform 100ms ease-out;
    }
    .btn-primary:hover { background: var(--accent-hover); box-shadow: var(--shadow-md); }
    .btn-primary:active { transform: scale(0.96); }
    .btn-primary:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .btn-lg {
      padding: var(--sp-4) var(--sp-8);
      font-size: 1.125rem;
      border-radius: var(--r-xl);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-md);
    }

    .feature-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: var(--r-lg);
      background: var(--sa-50);
      color: var(--accent);
    }
    [data-theme="dark"] .feature-icon {
      background: oklch(0.28 0.04 178);
    }
    .feature-icon svg { width: 24px; height: 24px; }

    .section-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--text);
      text-wrap: balance;
    }
    .section-subtitle {
      font-size: 1rem;
      line-height: 1.6;
      color: var(--text-muted);
      max-width: 540px;
      text-wrap: balance;
    }

    .stat-number {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: var(--accent);
    }
    .stat-label {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    /* ── Reduced motion ────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="stage"></div>

  <nav class="proto-picker" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Power &amp; Energy</button>
    <button class="proto-picker-item">Community Hub</button>
    <button class="proto-picker-item">Minimal Premium</button>
  </nav>

  <script>
    /* ── Dark mode toggle ──────────────────────────────── */
    function toggleTheme() {
      const html = document.documentElement;
      const next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      html.setAttribute('data-theme', next);
      localStorage.setItem('sa-theme', next);
    }

    (function initTheme() {
      const saved = localStorage.getItem('sa-theme');
      if (saved) {
        document.documentElement.setAttribute('data-theme', saved);
      } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();

    /* ── SVG logo (inline) ─────────────────────────────── */
    const themeToggle = `
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>`;

    /* ── Feature icons ─────────────────────────────────── */
    const iconDumbbell = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5h11M6.5 17.5h11"/><rect x="3" y="8" width="3" height="8" rx="1"/><rect x="18" y="8" width="3" height="8" rx="1"/><line x1="6.5" y1="12" x2="17.5" y2="12"/></svg>`;
    const iconUsers = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`;
    const iconHeart = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`;
    const iconApple = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c-4 0-7 3-7 7 0 2 1 4 2 5l-1 5h8l-1-5c1-1 2-3 2-5 0-4-3-7-7-7z"/><line x1="12" y1="2" x2="12" y2="5"/></svg>`;
    const iconMapPin = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`;
    const iconCalendar = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`;

    /* ── Variants ──────────────────────────────────────── */
    const variants = [

      /* ═══════════════════════════════════════════════════
         Variant 1 — Power & Energy
         Dynamic gradient, geometric decorators, impact stats
         ═══════════════════════════════════════════════════ */
      function variant1() {
        return `
          <div style="
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
          ">
            ${themeToggle}

            <!-- Gradient backdrop -->
            <div style="
              position: absolute;
              inset: 0;
              background:
                linear-gradient(165deg, oklch(0.50 0.10 178) 0%, oklch(0.38 0.08 178) 40%, oklch(0.22 0.04 180) 100%);
              pointer-events: none;
            "></div>

            <!-- Geometric decorators -->
            <div style="
              position: absolute;
              top: 8%;
              right: 10%;
              width: 140px;
              height: 140px;
              border: 3px solid oklch(1 0 0 / 0.08);
              transform: rotate(45deg);
              pointer-events: none;
            "></div>
            <div style="
              position: absolute;
              bottom: 18%;
              left: 6%;
              width: 0;
              height: 0;
              border-left: 60px solid transparent;
              border-right: 60px solid transparent;
              border-bottom: 100px solid oklch(1 0 0 / 0.06);
              pointer-events: none;
            "></div>
            <div style="
              position: absolute;
              top: 30%;
              left: 12%;
              width: 80px;
              height: 80px;
              border: 2px solid oklch(1 0 0 / 0.10);
              border-radius: 50%;
              pointer-events: none;
            "></div>
            <div style="
              position: absolute;
              bottom: 10%;
              right: 15%;
              width: 100px;
              height: 100px;
              background: oklch(1 0 0 / 0.04);
              transform: rotate(30deg);
              pointer-events: none;
            "></div>
            <!-- Chevron accent -->
            <div style="
              position: absolute;
              top: 55%;
              right: 22%;
              pointer-events: none;
              color: oklch(1 0 0 / 0.07);
            ">
              <svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </div>

            <!-- Hero content -->
            <div style="
              position: relative;
              z-index: 1;
              flex: 1;
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              padding: var(--sp-16) var(--sp-6);
              text-align: center;
              gap: var(--sp-10);
            ">
              <!-- Logo -->
              <div style="display: flex; flex-direction: column; align-items: center; gap: var(--sp-3);">
                <svg width="56" height="56" viewBox="0 0 56 56" fill="none" style="flex-shrink:0;">
                  <path d="M28 4L4 44h48L28 4z" fill="oklch(1 0 0 / 0.15)" stroke="oklch(1 0 0 / 0.5)" stroke-width="2" stroke-linejoin="round"/>
                  <path d="M28 16l-12 24h24L28 16z" fill="oklch(1 0 0 / 0.25)" stroke="oklch(1 0 0 / 0.4)" stroke-width="1.5" stroke-linejoin="round"/>
                  <circle cx="28" cy="32" r="4" fill="oklch(1 0 0 / 0.6)" stroke="oklch(1 0 0 / 0.8)" stroke-width="1.5"/>
                </svg>
                <span style="
                  font-size: 0.8125rem;
                  font-weight: 700;
                  color: oklch(1 0 0 / 0.7);
                  letter-spacing: 0.12em;
                  text-transform: uppercase;
                ">Summit Athletics</span>
              </div>

              <!-- Heading -->
              <h1 style="
                font-size: clamp(2.25rem, 6vw, 3.5rem);
                font-weight: 800;
                letter-spacing: -0.03em;
                line-height: 1.1;
                color: #fff;
                max-width: 600px;
                text-wrap: balance;
              ">Your Strength.<br>Our Community.</h1>

              <!-- Stats row -->
              <div style="
                display: flex;
                gap: var(--sp-12);
                flex-wrap: wrap;
                justify-content: center;
              ">
                <div style="display: flex; flex-direction: column; align-items: center; gap: var(--sp-1);">
                  <span class="stat-number" style="color: #fff;">12</span>
                  <span class="stat-label" style="color: oklch(1 0 0 / 0.6);">Locations</span>
                </div>
                <div style="display: flex; flex-direction: column; align-items: center; gap: var(--sp-1);">
                  <span class="stat-number" style="color: #fff;">50K+</span>
                  <span class="stat-label" style="color: oklch(1 0 0 / 0.6);">Members</span>
                </div>
                <div style="display: flex; flex-direction: column; align-items: center; gap: var(--sp-1);">
                  <span class="stat-number" style="color: #fff;">200+</span>
                  <span class="stat-label" style="color: oklch(1 0 0 / 0.6);">Classes/Week</span>
                </div>
              </div>

              <!-- CTA -->
              <button class="btn-primary btn-lg" style="
                background: #fff;
                color: oklch(0.50 0.10 178);
                margin-top: var(--sp-4);
                font-weight: 700;
              ">
                Start Your Journey
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
              </button>
            </div>

            <!-- Bottom bar -->
            <div style="
              position: relative;
              z-index: 1;
              display: flex;
              justify-content: center;
              gap: var(--sp-8);
              padding: var(--sp-6);
              border-top: 1px solid oklch(1 0 0 / 0.08);
            ">
              <span style="font-size: 0.8125rem; color: oklch(1 0 0 / 0.45);">12 Locations Nationwide</span>
              <span style="font-size: 0.8125rem; color: oklch(1 0 0 / 0.45);">Open 7 Days a Week</span>
              <span style="font-size: 0.8125rem; color: oklch(1 0 0 / 0.45);">Free Trial Available</span>
            </div>
          </div>`;
      },

      /* ═══════════════════════════════════════════════════
         Variant 2 — Community Hub
         Soft gradient, warm feel, feature cards, testimonial
         ═══════════════════════════════════════════════════ */
      function variant2() {
        return `
          <div style="
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
          ">
            ${themeToggle}

            <!-- Soft gradient backdrop -->
            <div style="
              position: absolute;
              inset: 0;
              background:
                linear-gradient(145deg, oklch(0.93 0.03 178) 0%, oklch(0.96 0.015 120) 50%, oklch(0.94 0.02 178) 100%);
              pointer-events: none;
            "></div>
            [data-theme="dark"] & {
              background: linear-gradient(145deg, oklch(0.22 0.03 178) 0%, oklch(0.19 0.02 180) 50%, oklch(0.24 0.025 175) 100%);
            }

            <!-- Rounded shapes decorator -->
            <div style="
              position: absolute;
              top: -60px;
              right: -40px;
              width: 200px;
              height: 200px;
              border-radius: 50%;
              background: oklch(0.55 0.09 175 / 0.08);
              pointer-events: none;
            "></div>
            <div style="
              position: absolute;
              bottom: 10%;
              left: -30px;
              width: 140px;
              height: 140px;
              border-radius: 50%;
              background: oklch(0.60 0.08 170 / 0.06);
              pointer-events: none;
            "></div>
            <div style="
              position: absolute;
              top: 40%;
              right: 8%;
              width: 80px;
              height: 80px;
              border-radius: var(--r-xl);
              background: oklch(0.55 0.09 175 / 0.05);
              transform: rotate(15deg);
              pointer-events: none;
            "></div>

            <!-- Hero -->
            <section style="
              position: relative;
              z-index: 1;
              display: flex;
              flex-direction: column;
              align-items: center;
              text-align: center;
              padding: var(--sp-20) var(--sp-6) var(--sp-12);
              gap: var(--sp-6);
            ">
              <div style="display: flex; align-items: center; gap: var(--sp-3);">
                <svg width="40" height="40" viewBox="0 0 56 56" fill="none" style="flex-shrink:0;">
                  <path d="M28 4L4 44h48L28 4z" fill="var(--sa-100)" stroke="var(--sa-500)" stroke-width="2" stroke-linejoin="round"/>
                  <path d="M28 16l-12 24h24L28 16z" fill="var(--sa-200)" stroke="var(--sa-600)" stroke-width="1.5" stroke-linejoin="round"/>
                  <circle cx="28" cy="32" r="4" fill="var(--accent)" stroke="var(--sa-700)" stroke-width="1.5"/>
                </svg>
                <span style="
                  font-size: 1.25rem;
                  font-weight: 700;
                  letter-spacing: -0.02em;
                  color: var(--text);
                ">Summit Athletics</span>
              </div>

              <h1 style="
                font-size: clamp(1.75rem, 4.5vw, 2.75rem);
                font-weight: 700;
                letter-spacing: -0.03em;
                line-height: 1.15;
                color: var(--text);
                max-width: 520px;
                text-wrap: balance;
              ">Your Strength. Our Community.</h1>

              <p style="
                font-size: 1.0625rem;
                line-height: 1.6;
                color: var(--text-muted);
                max-width: 440px;
                text-wrap: balance;
              ">Where every rep counts and every member matters. Find your fit across 12 premium locations.</p>

              <button class="btn-primary" style="margin-top: var(--sp-2);">
                Join the Community
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
              </button>
            </section>

            <!-- Feature cards -->
            <section style="
              position: relative;
              z-index: 1;
              padding: var(--sp-8) var(--sp-6) var(--sp-16);
            ">
              <div class="container" style="display: flex; flex-direction: column; align-items: center; gap: var(--sp-8);">
                <div style="
                  display: grid;
                  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
                  gap: var(--sp-5);
                  width: 100%;
                  max-width: 880px;
                ">
                  <!-- Card 1 -->
                  <div class="card" style="padding: var(--sp-6); display: flex; flex-direction: column; gap: var(--sp-3);">
                    <div class="feature-icon">${iconDumbbell}</div>
                    <h3 style="font-size: 1rem; font-weight: 600; color: var(--text);">Personal Training</h3>
                    <p style="font-size: 0.875rem; line-height: 1.5; color: var(--text-muted);">One-on-one coaching tailored to your goals with certified trainers.</p>

                  <!-- Card 2 -->

    /* ── Picker wiring (verbatim) ──────────────────────── */
    const stage = document.getElementById('stage');
    const picker = document.querySelector('.proto-picker');
    const highlight = picker.querySelector('.proto-picker-highlight');
    const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
    const replay = picker.querySelector('.proto-picker-replay');
    let current = 0;

    function moveHighlight() {
      const el = items[current];
      highlight.style.width = el.offsetWidth + 'px';
      highlight.style.transform = `translateX(${el.offsetLeft}px)`;
    }

    function mount(i) {
      stage.innerHTML = '';
      requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
    }

    function setActive(i) {
      if (i < 0 || i >= variants.length) return;
      current = i;
      items.forEach((el, j) => {
        el.toggleAttribute('data-active', j === i);
        if (j === i) el.setAttribute('aria-current', 'true');
        else el.removeAttribute('aria-current');
      });
      moveHighlight();
      const url = new URL(location);
      url.searchParams.set('v', i + 1);
      history.replaceState(null, '', url);
      mount(i);
    }

    items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
    replay?.addEventListener('click', () => mount(current));
    window.addEventListener('resize', moveHighlight);

    document.addEventListener('keydown', (e) => {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const num = parseInt(e.key, 10);
      if (num >= 1 && num <= variants.length) setActive(num - 1);
      else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
      else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
      else if (e.key === 'r' || e.key === 'R') mount(current);
    });

    setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
    requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
  </script>
