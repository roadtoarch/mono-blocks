<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Summit Athletics — Dashboard Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ===== RESET ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ===== DESIGN TOKENS ===== */
    :root {
      /* Primary palette — teal */
      --color-primary: oklch(0.50 0.10 178);
      --color-primary-hover: oklch(0.44 0.11 178);
      --color-primary-light: oklch(0.92 0.04 178);
      --color-primary-muted: oklch(0.70 0.08 170);

      /* Secondary & Accent */
      --color-secondary: oklch(0.60 0.08 170);
      --color-accent: oklch(0.55 0.09 175);

      /* Semantic */
      --color-success: oklch(0.62 0.17 155);
      --color-warning: oklch(0.75 0.15 80);
      --color-danger: oklch(0.58 0.18 25);
      --color-info: oklch(0.60 0.10 240);

      /* Spacing */
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --space-10: 2.5rem;
      --space-12: 3rem;
      --space-16: 4rem;

      /* Border radius — concentric */
      --radius-sm: 2px;
      --radius-md: 4px;
      --radius-lg: 8px;
      --radius-xl: 12px;
      --radius-full: 999px;

      /* Shadows — light mode 3-layer */
      --shadow-sm: 0 1px 2px oklch(0.2 0.02 178 / 0.06);
      --shadow-md: 0 2px 8px oklch(0.2 0.02 178 / 0.08), 0 1px 2px oklch(0.2 0.02 178 / 0.04);
      --shadow-lg: 0 4px 16px oklch(0.2 0.02 178 / 0.10), 0 2px 4px oklch(0.2 0.02 178 / 0.06), 0 1px 2px oklch(0.2 0.02 178 / 0.04);

      /* Layout */
      --header-height: 3rem;
      --sidebar-width: 14rem;

      /* Typography */
      --font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-size-xs: 0.75rem;
      --font-size-sm: 0.875rem;
      --font-size-base: 1rem;
      --font-size-lg: 1.125rem;
      --font-size-xl: 1.25rem;
      --font-size-2xl: 1.5rem;
      --font-size-3xl: 2rem;
      --font-size-4xl: 2.5rem;
      --line-height-tight: 1.2;
      --line-height-normal: 1.5;
      --line-height-relaxed: 1.65;
    }

    /* ===== LIGHT THEME ===== */
    [data-theme="light"] {
      --bg: oklch(0.97 0.005 80);
      --surface: oklch(0.94 0.01 80);
      --surface-raised: oklch(1.0 0 0);
      --surface-overlay: oklch(0.96 0.008 80);
      --header-bg: oklch(1.0 0 0);
      --sidebar-bg: oklch(0.955 0.008 80);
      --text-primary: oklch(0.18 0.02 180);
      --text-secondary: oklch(0.45 0.03 178);
      --text-tertiary: oklch(0.58 0.02 178);
      --border-color: oklch(0.89 0.008 80);
      --border-subtle: oklch(0.93 0.005 80);
      --hover-bg: oklch(0.95 0.005 80);
      --active-bg: oklch(0.92 0.008 80);
      --focus-ring: oklch(0.50 0.10 178 / 0.35);
      --nav-active-bg: oklch(0.92 0.04 178);
      --nav-active-text: oklch(0.42 0.12 178);
      --badge-bg: oklch(0.93 0.03 178);
      --badge-text: oklch(0.42 0.12 178);
      --scrollbar-track: oklch(0.95 0.003 80);
      --scrollbar-thumb: oklch(0.85 0.01 80);
    }

    /* ===== DARK THEME ===== */
    [data-theme="dark"] {
      --bg: oklch(0.20 0.03 180);
      --surface: oklch(0.26 0.03 175);
      --surface-raised: oklch(0.28 0.028 178);
      --surface-overlay: oklch(0.22 0.03 178);
      --header-bg: oklch(0.22 0.03 178);
      --sidebar-bg: oklch(0.21 0.03 180);
      --text-primary: oklch(0.94 0.008 80);
      --text-secondary: oklch(0.75 0.015 178);
      --text-tertiary: oklch(0.58 0.015 178);
      --border-color: oklch(0.34 0.025 178);
      --border-subtle: oklch(0.28 0.02 178);
      --hover-bg: oklch(0.28 0.025 178);
      --active-bg: oklch(0.30 0.028 178);
      --focus-ring: oklch(0.50 0.10 178 / 0.5);
      --nav-active-bg: oklch(0.26 0.06 178);
      --nav-active-text: oklch(0.75 0.12 178);
      --badge-bg: oklch(0.26 0.06 178);
      --badge-text: oklch(0.78 0.12 178);
      --shadow-sm: none;
      --shadow-md: 0 0 0 1px oklch(0.36 0.02 178);
      --shadow-lg: 0 0 0 1px oklch(0.34 0.02 178);
      --scrollbar-track: oklch(0.20 0.02 178);
      --scrollbar-thumb: oklch(0.34 0.025 178);
    }

    /* ===== BASE ===== */
    html {
      font-family: var(--font-family);
      font-size: 16px;
      line-height: var(--line-height-normal);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      color: var(--text-primary);
      background: var(--bg);
    }
    body { min-height: 100vh; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: var(--radius-full); }

    /* ===== LAYOUT SHELL ===== */
    .shell { display: flex; min-height: 100vh; }

    /* ===== SIDEBAR ===== */
    .sidebar {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: var(--sidebar-width);
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      z-index: 100;
      overflow: hidden;
    }
    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      height: var(--header-height);
      padding: 0 var(--space-4);
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }
    .sidebar-brand-icon {
      width: 28px; height: 28px;
      border-radius: var(--radius-md);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-primary);
      color: oklch(1.0 0 0);
    }
    .sidebar-brand-icon svg { width: 16px; height: 16px; }
    .sidebar-brand-text {
      font-weight: 700;
      font-size: var(--font-size-sm);
      white-space: nowrap;
      overflow: hidden;
    }

    .sidebar-nav { flex: 1; padding: var(--space-3) var(--space-2); overflow-y: auto; }
    .sidebar-nav-item {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      text-decoration: none;
      font-size: var(--font-size-sm);
      font-weight: 500;
      cursor: pointer;
      transition: background 120ms ease-out, color 120ms ease-out;
      white-space: nowrap;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }
    .sidebar-nav-item:hover { background: var(--hover-bg); color: var(--text-primary); }
    .sidebar-nav-item.active { background: var(--nav-active-bg); color: var(--nav-active-text); font-weight: 600; }
    .sidebar-nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
    .sidebar-nav-item-label { overflow: hidden; }

    .sidebar-section-label {
      font-size: var(--font-size-xs);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-tertiary);
      padding: var(--space-4) var(--space-3) var(--space-2);
      white-space: nowrap;
      overflow: hidden;
    }

    .sidebar-footer {
      padding: var(--space-3);
      border-top: 1px solid var(--border-color);
    }

    /* ===== MAIN WRAPPER ===== */
    .main-wrapper {
      flex: 1;
      margin-left: var(--sidebar-width);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ===== HEADER (top bar) ===== */
    .header {
      position: sticky;
      top: 0;
      height: var(--header-height);
      background: var(--header-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      padding: 0 var(--space-6);
      gap: var(--space-4);
      z-index: 90;
      box-shadow: var(--shadow-sm);
    }
    .header-title {
      font-size: var(--font-size-base);
      font-weight: 700;
      color: var(--text-primary);
    }
    .header-spacer { flex: 1; }
    .header-actions { display: flex; align-items: center; gap: var(--space-2); }

    .icon-btn {
      display: flex; align-items: center; justify-content: center;
      width: 36px; height: 36px;
      border: none; background: none;
      border-radius: var(--radius-full);
      color: var(--text-secondary);
      cursor: pointer;
      transition: background 120ms ease-out, color 120ms ease-out;
    }
    .icon-btn:hover { background: var(--hover-bg); color: var(--text-primary); }
    .icon-btn:active { transform: scale(0.96); }
    .icon-btn svg { width: 20px; height: 20px; }

    .avatar {
      width: 32px; height: 32px;
      border-radius: var(--radius-full);
      background: var(--color-primary);
      color: oklch(1.0 0 0);
      display: flex; align-items: center; justify-content: center;
      font-size: var(--font-size-sm);
      font-weight: 700;
      flex-shrink: 0;
      cursor: pointer;
      transition: box-shadow 150ms ease-out;
    }
    .avatar:hover {
      box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--color-primary);
    }

    /* ===== CONTENT ===== */
    .content {
      flex: 1;
      padding: var(--space-8);
      max-width: 72ch;
    }
    .content-wide { max-width: none; }

    /* ===== TYPOGRAPHY ===== */
    h1 { font-size: var(--font-size-3xl); font-weight: 800; line-height: var(--line-height-tight); color: var(--text-primary); text-wrap: balance; }
    h2 { font-size: var(--font-size-2xl); font-weight: 700; line-height: var(--line-height-tight); color: var(--text-primary); text-wrap: balance; }
    h3 { font-size: var(--font-size-xl); font-weight: 600; line-height: var(--line-height-tight); color: var(--text-primary); text-wrap: balance; }
    h4 { font-size: var(--font-size-lg); font-weight: 600; line-height: var(--line-height-tight); color: var(--text-primary); text-wrap: balance; }
    p { line-height: var(--line-height-relaxed); color: var(--text-secondary); max-width: 65ch; }

    /* ===== CARDS ===== */
    .card {
      background: var(--surface-raised);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: var(--space-6);
      box-shadow: var(--shadow-sm);
      transition: box-shadow 150ms ease-out, transform 150ms ease-out;
    }
    .card:hover { box-shadow: var(--shadow-md); }

    /* ===== BADGE ===== */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: var(--space-1) var(--space-3);
      border-radius: var(--radius-full);
      font-size: var(--font-size-xs);
      font-weight: 600;
      background: var(--badge-bg);
      color: var(--badge-text);
    }
    .badge-success { background: oklch(0.90 0.05 155); color: oklch(0.38 0.12 155); }
    .badge-warning { background: oklch(0.92 0.06 80); color: oklch(0.42 0.12 80); }
    .badge-danger { background: oklch(0.90 0.06 25); color: oklch(0.45 0.14 25); }
    .badge-info { background: oklch(0.90 0.04 240); color: oklch(0.42 0.10 240); }

    [data-theme="dark"] .badge-success { background: oklch(0.62 0.17 155 / 0.2); color: oklch(0.78 0.14 155); }
    [data-theme="dark"] .badge-warning { background: oklch(0.75 0.15 80 / 0.2); color: oklch(0.82 0.14 80); }
    [data-theme="dark"] .badge-danger { background: oklch(0.58 0.18 25 / 0.2); color: oklch(0.80 0.14 25); }
    [data-theme="dark"] .badge-info { background: oklch(0.60 0.10 240 / 0.2); color: oklch(0.78 0.10 240); }

    /* ===== BUTTON ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      height: 2.5rem;
      padding: 0 var(--space-3);
      border: none;
      border-radius: var(--radius-md);
      font-family: var(--font-family);
      font-size: var(--font-size-sm);
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: background 120ms ease-out, transform 100ms ease-out, box-shadow 120ms ease-out;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: var(--color-primary); color: oklch(1.0 0 0); }
    .btn-primary:hover { background: var(--color-primary-hover); }
    .btn svg { width: 16px; height: 16px; flex-shrink: 0; }
    .btn-outline { background: transparent; color: var(--text-primary); border: 1px solid var(--border-color); }
    .btn-outline:hover { background: var(--hover-bg); }

    /* ===== GRID HELPERS ===== */
    .grid { display: grid; gap: var(--space-4); }
    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-4 { grid-template-columns: repeat(4, 1fr); }

    /* ===== SECTION ===== */
    .section { margin-bottom: var(--space-8); }
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-4); }

    /* ===== FOOTER ===== */
    .footer {
      padding: var(--space-4) var(--space-6);
      border-top: 1px solid var(--border-color);
      font-size: var(--font-size-xs);
      color: var(--text-tertiary);
      text-align: center;
    }

    /* ===== PROGRESS RING ===== */
    .progress-ring { transform: rotate(-90deg); }
    .progress-ring-bg { fill: none; stroke: var(--border-color); }
    .progress-ring-fill { fill: none; stroke-linecap: round; transition: stroke-dashoffset 600ms ease-out; }

    /* ===== STATUS DOT ===== */
    .status-dot {
      width: 8px; height: 8px;
      border-radius: var(--radius-full);
      display: inline-block;
      flex-shrink: 0;
    }
    .status-dot-active { background: var(--color-success); }
    .status-dot-pending { background: var(--color-warning); }

    /* ===== VARIANT-SPECIFIC: MEMBER DASHBOARD ===== */
    .welcome-banner {
      background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
      border-radius: var(--radius-xl);
      padding: var(--space-8);
      color: oklch(1.0 0 0);
      margin-bottom: var(--space-8);
    }
    [data-theme="dark"] .welcome-banner {
      background: linear-gradient(135deg, oklch(0.50 0.10 178 / 0.3), oklch(0.60 0.08 170 / 0.2));
      border: 1px solid var(--border-color);
    }
    .welcome-banner h1 { color: oklch(1.0 0 0); margin-bottom: var(--space-2); }
    .welcome-banner p { color: oklch(0.94 0.008 80); max-width: none; }
    .welcome-tier {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      background: oklch(1.0 0 0 / 0.2);
      padding: var(--space-1) var(--space-3);
      border-radius: var(--radius-full);
      font-size: var(--font-size-sm);
      font-weight: 600;
      margin-top: var(--space-3);
    }

    .schedule-item {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      padding: var(--space-3) 0;
      border-bottom: 1px solid var(--border-subtle);
    }
    .schedule-item:last-child { border-bottom: none; }
    .schedule-time {
      font-size: var(--font-size-sm);
      font-weight: 700;
      color: var(--color-primary);
      min-width: 5rem;
      font-variant-numeric: tabular-nums;
    }
    .schedule-info { flex: 1; }
    .schedule-name { font-size: var(--font-size-sm); font-weight: 600; color: var(--text-primary); }
    .schedule-meta { font-size: var(--font-size-xs); color: var(--text-tertiary); margin-top: var(--space-1); }

    .quick-action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-5) var(--space-4);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      background: var(--surface-raised);
      color: var(--text-primary);
      font-size: var(--font-size-sm);
      font-weight: 600;
      font-family: var(--font-family);
      cursor: pointer;
      transition: transform 150ms ease-out, background 150ms ease-out, border-color 150ms ease-out, box-shadow 150ms ease-out;
    }
    .quick-action-btn:hover {
      background: var(--surface);
      border-color: var(--color-primary);
      box-shadow: var(--shadow-md);
    }
    .quick-action-btn:active { transform: scale(0.96); }
    .quick-action-icon {
      width: 40px; height: 40px;
      border-radius: var(--radius-lg);
      background: var(--color-primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-primary);
    }
    [data-theme="dark"] .quick-action-icon {
      background: oklch(0.50 0.10 178 / 0.15);
    }
    .quick-action-icon svg { width: 20px; height: 20px; }

    /* ===== VARIANT-SPECIFIC: TRAINER VIEW ===== */
    .client-row {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3) 0;
      border-bottom: 1px solid var(--border-subtle);
    }
    .client-row:last-child { border-bottom: none; }
    .client-avatar {
      width: 36px; height: 36px;
      border-radius: var(--radius-full);
      background: var(--color-primary-light);
      color: var(--color-primary);
      display: flex; align-items: center; justify-content: center;
      font-size: var(--font-size-xs);
      font-weight: 700;
      flex-shrink: 0;
    }
    [data-theme="dark"] .client-avatar {
      background: oklch(0.50 0.10 178 / 0.2);
    }
    .client-info { flex: 1; }
    .client-name { font-size: var(--font-size-sm); font-weight: 600; color: var(--text-primary); }
    .client-meta { font-size: var(--font-size-xs); color: var(--text-tertiary); }
    .client-time {
      font-size: var(--font-size-xs);
      font-weight: 600;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    .timeline-slot {
      display: flex;
      align-items: stretch;
      gap: var(--space-3);
      padding: var(--space-3) 0;
      border-bottom: 1px solid var(--border-subtle);
      min-height: 3rem;
    }
    .timeline-slot:last-child { border-bottom: none; }
    .timeline-time {
      font-size: var(--font-size-xs);
      font-weight: 600;
      color: var(--text-tertiary);
      min-width: 4rem;
      font-variant-numeric: tabular-nums;
      padding-top: 2px;
    }
    .timeline-bar {
      width: 3px;
      background: var(--border-color);
      border-radius: var(--radius-full);
      flex-shrink: 0;
    }
    .timeline-bar.active { background: var(--color-primary); }
    .timeline-content { flex: 1; }
    .timeline-title { font-size: var(--font-size-sm); font-weight: 600; color: var(--text-primary); }
    .timeline-sub { font-size: var(--font-size-xs); color: var(--text-tertiary); margin-top: var(--space-1); }

    .revenue-stat {
      text-align: center;
      padding: var(--space-4);
    }
    .revenue-value {
      font-size: var(--font-size-2xl);
      font-weight: 800;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
    }
    .revenue-label {
      font-size: var(--font-size-xs);
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
      margin-top: var(--space-1);
    }

    /* ===== VARIANT-SPECIFIC: PERFORMANCE HUB ===== */
    .perf-stat-number {
      font-size: var(--font-size-4xl);
      font-weight: 800;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .perf-stat-meta {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-top: var(--space-2);
    }
    .perf-trend {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      font-size: var(--font-size-sm);
      font-weight: 600;
    }
    .perf-trend.up { color: var(--color-success); }
    .perf-trend.down { color: var(--color-danger); }
    .perf-trend svg { width: 14px; height: 14px; }
    .perf-stat-period { font-size: var(--font-size-xs); color: var(--text-tertiary); }

    .chart-area {
      height: 140px;
      border-radius: var(--radius-lg);
      background: linear-gradient(180deg, var(--color-primary-light) 0%, transparent 100%);
      position: relative;
      overflow: hidden;
    }
    [data-theme="dark"] .chart-area {
      background: linear-gradient(180deg, oklch(0.50 0.10 178 / 0.12) 0%, transparent 100%);
    }
    .chart-line {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--color-primary);
    }

    .goal-card {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      padding: var(--space-4);
      border-bottom: 1px solid var(--border-subtle);
    }
    .goal-card:last-child { border-bottom: none; }

function toggleTheme() {
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  html.setAttribute('data-theme', next);
  localStorage.setItem('sa-theme', next);
}

/* Detect system preference */
(function initTheme() {
  const stored = localStorage.getItem('sa-theme');
  if (stored) {
    document.documentElement.setAttribute('data-theme', stored);
  } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.documentElement.setAttribute('data-theme', 'dark');

})();

/* ═══════════════════════════════════════════
   PICKER WIRING (VERBATIM)
   ═══════════════════════════════════════════ */
const variants = [variant1, variant2, variant3];
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker?.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
