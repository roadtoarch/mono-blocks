<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACME Corp — Dashboard Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* ===== RESET ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ===== DESIGN TOKENS ===== */
    :root {
      /* Primary palette — hue 300 */
      --color-primary-50: oklch(0.97 0.01 300);
      --color-primary-100: oklch(0.93 0.03 300);
      --color-primary-200: oklch(0.87 0.06 300);
      --color-primary-300: oklch(0.78 0.1 300);
      --color-primary-400: oklch(0.68 0.15 300);
      --color-primary-500: oklch(0.502 0.126 300.4);
      --color-primary-600: oklch(0.46 0.19 300);
      --color-primary-700: oklch(0.38 0.16 300);
      --color-primary-800: oklch(0.3 0.12 300);
      --color-primary-900: oklch(0.22 0.08 300);

      /* Neutral palette — hue 308 */
      --color-neutral-50: oklch(0.985 0.002 308);
      --color-neutral-100: oklch(0.965 0.003 308);
      --color-neutral-200: oklch(0.93 0.005 308);
      --color-neutral-300: oklch(0.88 0.007 308);
      --color-neutral-400: oklch(0.78 0.009 308);
      --color-neutral-500: oklch(0.62 0.01 308);
      --color-neutral-600: oklch(0.5 0.012 308);
      --color-neutral-700: oklch(0.38 0.013 308);
      --color-neutral-800: oklch(0.25 0.015 308);
      --color-neutral-900: oklch(0.15 0.025 308);

      /* Semantic tokens — light mode */
      --bg: oklch(0.962 0.014 308.3);
      --surface: oklch(0.933 0.023 308.2);
      --surface-elevated: #ffffff;
      --border: oklch(0.91 0.006 308);
      --border-strong: oklch(0.85 0.008 308);
      --text: oklch(0.18 0.02 308);
      --text-secondary: oklch(0.45 0.012 308);
      --text-tertiary: oklch(0.58 0.01 308);
      --primary: #7050a0;
      --primary-hover: oklch(0.502 0.126 300.4);
      --primary-text: #ffffff;
      --danger: oklch(0.58 0.2 25);
      --success: oklch(0.62 0.17 155);
      --warning: oklch(0.75 0.15 80);

      /* Shadows — 3-layer light */
      --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.04), 0 1px 4px oklch(0 0 0 / 0.03), 0 2px 8px oklch(0 0 0 / 0.02);
      --shadow-md: 0 2px 4px oklch(0 0 0 / 0.05), 0 4px 12px oklch(0 0 0 / 0.04), 0 8px 24px oklch(0 0 0 / 0.03);
      --shadow-lg: 0 4px 8px oklch(0 0 0 / 0.06), 0 8px 24px oklch(0 0 0 / 0.05), 0 16px 48px oklch(0 0 0 / 0.04);
      --shadow-ring: none;

      /* Radii */
      --radius-sm: 2px;
      --radius-md: 4px;
      --radius-lg: 8px;
      --radius-xl: 12px;
      --radius-full: 9999px;

      /* Spacing */
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --space-10: 2.5rem;
      --space-12: 3rem;
      --space-16: 4rem;

      /* Typography */
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --text-xs: 0.75rem;
      --text-sm: 0.875rem;
      --text-base: 1rem;
      --text-lg: 1.125rem;
      --text-xl: 1.25rem;
      --text-2xl: 1.5rem;
      --text-3xl: 2rem;
      --text-4xl: 2.5rem;
      --line-height-body: 1.5;
      --line-height-heading: 1.2;
      --font-normal: 400;
      --font-semibold: 600;
      --font-bold: 700;

      /* Layout */
      --header-height: 3rem;
      --max-content-width: 65ch;
    }

    /* ===== DARK MODE ===== */
    [data-theme="dark"] {
      --bg: oklch(0.207 0.023 305.2);
      --surface: oklch(0.254 0.033 300.3);
      --surface-elevated: oklch(0.28 0.03 300);
      --border: oklch(0.3 0.018 308);
      --border-strong: oklch(0.38 0.016 308);
      --text: oklch(0.93 0.005 308);
      --text-secondary: oklch(0.72 0.008 308);
      --text-tertiary: oklch(0.58 0.01 308);
      --primary: #7050a0;
      --primary-hover: oklch(0.573 0.129 310.6);
      --primary-text: #ffffff;
      --shadow-sm: 0 0 0 1px oklch(1 0 0 / 0.06);
      --shadow-md: 0 0 0 1px oklch(1 0 0 / 0.08);
      --shadow-lg: 0 0 0 1px oklch(1 0 0 / 0.1);
      --shadow-ring: 0 0 0 1px oklch(1 0 0 / 0.08);
    }

    /* ===== BASE ===== */
    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    body {
      font-family: var(--font-family);
      font-size: var(--text-base);
      line-height: var(--line-height-body);
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
    }

    /* ===== SHARED COMPONENTS ===== */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: var(--header-height);
      padding: 0 var(--space-6);
      background: var(--surface-elevated);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }
    .header-logo, .header-logo-img {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-md);
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary-text);
      font-weight: var(--font-bold);
      font-size: var(--text-sm);
    }
    .header-brand {
      font-size: var(--text-lg);
      font-weight: var(--font-semibold);
      color: var(--text);
    }
    .header-nav {
      display: flex;
      align-items: center;
      gap: var(--space-1);
    }
    .header-nav a {
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-md);
      text-decoration: none;
      color: var(--text-secondary);
      font-size: var(--text-sm);
      font-weight: var(--font-normal);
      transition: color 150ms ease-out, background 150ms ease-out;
    }
    .header-nav a:hover {
      color: var(--text);
      background: var(--surface);
    }
    .header-nav a.active {
      color: var(--primary);
      background: var(--color-primary-50);
    }
    [data-theme="dark"] .header-nav a.active {
      background: oklch(0.502 0.126 300.4 / 0.15);
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }
    .theme-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: var(--text-base);
      transition: color 150ms ease-out, border-color 150ms ease-out, background 150ms ease-out;
    }
    .theme-toggle:hover {
      color: var(--text);
      border-color: var(--border-strong);
    }
    .theme-toggle:active {
      transform: scale(0.96);
    }
    .avatar {
      width: 2rem;
      height: 2rem;
      border-radius: var(--radius-full);
      background: var(--primary);
      color: var(--primary-text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--text-xs);
      font-weight: var(--font-semibold);
      cursor: pointer;
      transition: box-shadow 150ms ease-out;
    }
    .avatar:hover {
      box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--primary);
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-6);
      color: var(--text-tertiary);
      font-size: var(--text-sm);
      border-top: 1px solid var(--border);
    }

    .card {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      transition: box-shadow 150ms ease-out;
    }
    .card:hover {
      box-shadow: var(--shadow-lg);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: var(--space-1) var(--space-2);
      border-radius: var(--radius-full);
      font-size: var(--text-xs);
      font-weight: var(--font-semibold);
      line-height: 1;
    }
    .badge-success {
      background: oklch(0.62 0.17 155 / 0.12);
      color: oklch(0.5 0.15 155);
    }
    [data-theme="dark"] .badge-success {
      background: oklch(0.62 0.17 155 / 0.2);
      color: oklch(0.75 0.15 155);
    }
    .badge-primary {
      background: oklch(0.502 0.126 300.4 / 0.1);
      color: var(--primary);
    }
    [data-theme="dark"] .badge-primary {
      background: oklch(0.502 0.126 300.4 / 0.2);
    }
    .badge-warning {
      background: oklch(0.75 0.15 80 / 0.12);
      color: oklch(0.55 0.15 80);
    }
    [data-theme="dark"] .badge-warning {
      background: oklch(0.75 0.15 80 / 0.2);
      color: oklch(0.8 0.15 80);
    }

    .stat-value {
      font-size: var(--text-3xl);
      font-weight: var(--font-bold);
      line-height: var(--line-height-heading);
      color: var(--text);
    }
    .stat-label {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      margin-top: var(--space-1);
    }
    .stat-change {
      font-size: var(--text-xs);
      font-weight: var(--font-semibold);
      margin-top: var(--space-1);
    }
    .stat-change.positive { color: var(--success); }
    .stat-change.negative { color: var(--danger); }

    .section-title {
      font-size: var(--text-lg);
      font-weight: var(--font-semibold);
      color: var(--text);
      margin-bottom: var(--space-4);
    }

    .activity-item {
      display: flex;
      align-items: flex-start;
      gap: var(--space-3);
      padding: var(--space-3) 0;
    }
    .activity-item + .activity-item {
      border-top: 1px solid var(--border);
    }
    .activity-dot {
      width: 8px;
      height: 8px;
      border-radius: var(--radius-full);
      background: var(--primary);
      margin-top: 6px;
      flex-shrink: 0;
    }
    .activity-dot.success { background: var(--success); }
    .activity-dot.warning { background: var(--warning); }
    .activity-dot.danger { background: var(--danger); }
    .activity-text {
      font-size: var(--text-sm);
      color: var(--text);
      line-height: var(--text-sm);
    }
    .activity-meta {
      font-size: var(--text-xs);
      color: var(--text-tertiary);
      margin-top: var(--space-1);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      height: 2.5rem;
      padding: 0 var(--space-4);
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      font-family: var(--font-family);
      font-size: var(--text-sm);
      font-weight: var(--font-semibold);
      cursor: pointer;
      transition: transform 150ms ease-out, box-shadow 150ms ease-out, background 150ms ease-out;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary {
      background: var(--primary);
      color: var(--primary-text);
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-outline {
      background: transparent;
      color: var(--text);
      border-color: var(--border-strong);
    }
    .btn-outline:hover { background: var(--surface); }

    /* ===== UTILITY ===== */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    /* ===== VARIANT 1: CLEAN CARDS ===== */
    .v1 .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: var(--space-8) var(--space-6);
    }
    .v1 .welcome {
      margin-bottom: var(--space-8);
    }
    .v1 .welcome h1 {
      font-size: var(--text-3xl);
      font-weight: var(--font-bold);
      line-height: var(--line-height-heading);
      color: var(--text);
    }
    .v1 .welcome p {
      margin-top: var(--space-2);
      color: var(--text-secondary);
      max-width: var(--max-content-width);
    }
    .v1 .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-6);
      margin-bottom: var(--space-8);
    }
    .v1 .stat-card {
      padding: var(--space-6);
    }
    .v1 .content-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-6);
    }
    .v1 .activity-card {
      padding: var(--space-6);
    }
    .v1 .user-card {
      padding: var(--space-6);
    }
    .v1 .user-info {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      margin-bottom: var(--space-6);
    }
    .v1 .user-avatar-lg {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-full);
      background: var(--primary);
      color: var(--primary-text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--text-xl);
      font-weight: var(--font-bold);
      flex-shrink: 0;
    }
    .v1 .user-name {
      font-size: var(--text-xl);
      font-weight: var(--font-semibold);
    }
    .v1 .user-role {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      margin-top: var(--space-1);
    }
    .v1 .detail-row {
      display: flex;
      justify-content: space-between;
      padding: var(--space-3) 0;
      border-top: 1px solid var(--border);
    }
    .v1 .detail-label {
      font-size: var(--text-sm);
      color: var(--text-secondary);
    }
    .v1 .detail-value {
      font-size: var(--text-sm);
      font-weight: var(--font-semibold);
      color: var(--text);
    }

    /* ===== VARIANT 2: COMMAND CENTER ===== */
    .v2 .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: var(--space-4) var(--space-6);
    }
    .v2 .welcome {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-4);
    }
    .v2 .welcome h1 {
      font-size: var(--text-xl);
      font-weight: var(--font-bold);
      line-height: var(--line-height-heading);
    }
    .v2 .welcome p {
      font-size: var(--text-sm);
      color: var(--text-secondary);
    }
    .v2 .stats-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: var(--space-3);
      margin-bottom: var(--space-4);
    }
    .v2 .stat-card {
      padding: var(--space-4);
      text-align: center;
    }
    .v2 .stat-card .stat-value {
      font-size: var(--text-2xl);
    }
    .v2 .two-col {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: var(--space-4);
    }
    .v2 .activity-card {
      padding: var(--space-4);
    }
    .v2 .quick-card {
      padding: var(--space-4);
    }
    .v2 .quick-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-3);
    }
    .v2 .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-4);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface);
      color: var(--text);
      font-size: var(--text-sm);
      font-weight: var(--font-semibold);
      cursor: pointer;
      transition: transform 150ms ease-out, background 150ms ease-out, border-color 150ms ease-out;
    }
    .v2 .action-btn:hover {
      background: var(--surface-elevated);
      border-color: var(--primary);
    }
    .v2 .action-btn:active {
      transform: scale(0.96);
    }
    .v2 .action-icon {
      font-size: var(--text-2xl);
    }
    .v2 .activity-item {
      padding: var(--space-2) 0;
    }
    .v2 .section-title {
      font-size: var(--text-base);
      margin-bottom: var(--space-3);
    }
    .v2 .user-strip {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-4);
      background: var(--surface);
      border-radius: var(--radius-lg);
      margin-bottom: var(--space-4);
      border: 1px solid var(--border);
    }
    .v2 .user-strip .avatar { width: 2.5rem; height: 2.5rem; font-size: var(--text-sm); }
    .v2 .user-strip-info { flex: 1; }
    .v2 .user-strip-name { font-size: var(--text-sm); font-weight: var(--font-semibold); }
    .v2 .user-strip-role { font-size: var(--text-xs); color: var(--text-secondary); }
    .v2 .mini-stat {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      font-size: var(--text-xs);
      color: var(--text-secondary);
    }
    .v2 .mini-stat strong {
      color: var(--text);
      font-weight: var(--font-semibold);
    }

    /* ===== VARIANT 3: WELCOME HUB ===== */
    .v3 .page {
      max-width: 900px;
      margin: 0 auto;
      padding: var(--space-8) var(--space-6);
    }
    .v3 .hero {
      text-align: center;
      padding: var(--space-12) var(--space-8);
      background: linear-gradient(135deg, var(--color-primary-50), var(--surface-elevated));
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      margin-bottom: var(--space-8);
      box-shadow: var(--shadow-md);
    }
    [data-theme="dark"] .v3 .hero {
      background: linear-gradient(135deg, oklch(0.502 0.126 300.4 / 0.1), var(--surface-elevated));
    }
    .v3 .hero h1 {
      font-size: var(--text-4xl);
      font-weight: var(--font-bold);
      line-height: var(--line-height-heading);
      color: var(--text);
      margin-bottom: var(--space-3);
    }
    .v3 .hero p {
      font-size: var(--text-lg);
      color: var(--text-secondary);
      max-width: 48ch;
      margin: 0 auto var(--space-6);
    }
    .v3 .hero-actions {
      display: flex;
      gap: var(--space-3);
      justify-content: center;
    }
    .v3 .guides {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-6);
      margin-bottom: var(--space-8);
    }
    .v3 .guide-card {
      padding: var(--space-8) var(--space-6);
      text-align: center;
      cursor: pointer;
    }
    .v3 .guide-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }
    .v3 .guide-card:active {
      transform: scale(0.96);
    }
    .v3 .guide-icon {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-xl);
      background: var(--color-primary-50);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--text-2xl);
      margin: 0 auto var(--space-4);
    }
    [data-theme="dark"] .v3 .guide-icon {
      background: oklch(0.502 0.126 300.4 / 0.15);
    }
    .v3 .guide-card h3 {
      font-size: var(--text-lg);
      font-weight: var(--font-semibold);
      margin-bottom: var(--space-2);
    }
    .v3 .guide-card p {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      line-height: var(--line-height-body);
    }
    .v3 .bottom-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-6);
    }
    .v3 .activity-card {
      padding: var(--space-6);
    }
    .v3 .profile-card {
      padding: var(--space-6);
    }
    .v3 .profile-header {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      margin-bottom: var(--space-6);
    }
    .v3 .profile-avatar {
      width: 64px;
      height: 64px;
      border-radius: var(--radius-full);
      background: var(--primary);
      color: var(--primary-text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--text-2xl);
      font-weight: var(--font-bold);
    }
    .v3 .profile-name {
      font-size: var(--text-xl);
      font-weight: var(--font-semibold);
    }
    .v3 .profile-role {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      margin-top: var(--space-1);
    }
    .v3 .progress-bar {
      height: 6px;
      border-radius: var(--radius-full);
      background: var(--border);
      margin-top: var(--space-3);
      overflow: hidden;
    }

    /* ===== PICKER WIRING (VERBATIM) ===== */
    const variants = [variant1, variant2, variant3];
    const stage = document.getElementById('stage');
    const picker = document.querySelector('.proto-picker');
    const highlight = picker.querySelector('.proto-picker-highlight');
    const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
    const replay = picker?.querySelector('.proto-picker-replay');
    let current = 0;

    function moveHighlight() {
      const el = items[current];
      highlight.style.width = el.offsetWidth + 'px';
      highlight.style.transform = `translateX(${el.offsetLeft}px)`;
    }

    function mount(i) {
      stage.innerHTML = '';
      requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
    }

    function setActive(i) {
      if (i < 0 || i >= variants.length) return;
      current = i;
      items.forEach((el, j) => {
        el.toggleAttribute('data-active', j === i);
        if (j === i) el.setAttribute('aria-current', 'true');
        else el.removeAttribute('aria-current');
      });
      moveHighlight();
      const url = new URL(location);
      url.searchParams.set('v', i + 1);
      history.replaceState(null, '', url);
      mount(i);
    }

    items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
    replay?.addEventListener('click', () => mount(current));
    window.addEventListener('resize', moveHighlight);

    document.addEventListener('keydown', (e) => {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const num = parseInt(e.key, 10);
      if (num >= 1 && num <= variants.length) setActive(num - 1);
      else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
      else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
      else if (e.key === 'r' || e.key === 'R') mount(current);
    });

    setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
    requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
