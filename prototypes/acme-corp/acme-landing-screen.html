<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACME Corp — Landing Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── Reset ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Design tokens (OKLCH) ─────────────────────────── */
    :root {
      /* Primary palette — hue 300 (purple) */
      --acme-50:  oklch(0.962 0.014 308.3);
      --acme-100: oklch(0.750 0.076 314.3);
      --acme-200: oklch(0.573 0.129 310.6);
      --acme-400: oklch(0.502 0.126 300.4);
      --acme-500: oklch(0.502 0.126 300.4);
      --acme-600: oklch(0.46 0.120 300.4);
      --acme-700: oklch(0.316 0.060 305.9);
      --acme-900: oklch(0.279 0.060 305.9);

      /* Neutral palette — hue 307 (purple-tinted) */
      --neutral-50:  oklch(0.962 0.014 308.3);
      --neutral-100: oklch(0.933 0.023 308.2);
      --neutral-200: oklch(0.87  0.028 308.0);
      --neutral-300: oklch(0.87  0.030 307.6);
      --neutral-400: oklch(0.70  0.035 307.6);
      --neutral-500: oklch(0.55  0.040 307.6);
      --neutral-600: oklch(0.45  0.040 307.6);
      --neutral-700: oklch(0.35  0.040 307.6);
      --neutral-800: oklch(0.254 0.033 300.3);
      --neutral-900: oklch(0.207 0.023 305.2);

      /* Semantic — light mode */
      --bg:           oklch(0.962 0.014 308.3);
      --surface:      oklch(0.933 0.023 308.2);
      --surface-alt:  var(--neutral-200);
      --border:       var(--neutral-300);
      --text:         var(--neutral-900);
      --text-muted:   var(--neutral-600);
      --accent:       var(--acme-500);
      --accent-hover: var(--acme-600);
      --accent-text:  oklch(1 0 0);

      /* Shadows — 3-layer light */
      --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.06), 0 1px 3px oklch(0 0 0 / 0.04), 0 1px 1px oklch(0 0 0 / 0.03);
      --shadow-md: 0 2px 6px oklch(0 0 0 / 0.08), 0 4px 12px oklch(0 0 0 / 0.05), 0 1px 2px oklch(0 0 0 / 0.04);
      --shadow-lg: 0 4px 12px oklch(0 0 0 / 0.10), 0 8px 24px oklch(0 0 0 / 0.06), 0 2px 4px oklch(0 0 0 / 0.04);

      /* Radii */
      --r-sm: 2px;
      --r-md: 4px;
      --r-lg: 8px;
      --r-xl: 12px;

      /* Spacing */
      --sp-1: 4px;
      --sp-2: 8px;
      --sp-3: 12px;
      --sp-4: 16px;
      --sp-5: 20px;
      --sp-6: 24px;
      --sp-8: 32px;
      --sp-10: 40px;
      --sp-12: 48px;
      --sp-16: 64px;
      --sp-20: 80px;

      /* Transitions */
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    }

    [data-theme="dark"] {
      --bg:           oklch(0.207 0.023 305.2);
      --surface:      oklch(0.254 0.033 300.3);
      --surface-alt:  oklch(0.316 0.040 300.3);
      --border:       oklch(0.32 0.035 300.3);
      --text:         oklch(0.95 0.010 307.6);
      --text-muted:   oklch(0.60 0.035 307.6);
      --accent:       var(--acme-400);
      --accent-hover: var(--acme-200);
      --accent-text:  oklch(0.12 0.02 300.3);

      /* Shadows — single-ring dark */
      --shadow-sm: 0 0 0 1px oklch(1 0 0 / 0.06);
      --shadow-md: 0 0 0 1px oklch(1 0 0 / 0.08);
      --shadow-lg: 0 0 0 1px oklch(1 0 0 / 0.10);
    }

    /* ── Root typography ───────────────────────────────── */
    html {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background 200ms ease-out, color 200ms ease-out;
    }

    /* ── Stage ─────────────────────────────────────────── */
    #stage { min-height: 100dvh; }

    /* ── Dark mode toggle ──────────────────────────────── */
    .theme-toggle {
      position: fixed;
      top: var(--sp-5);
      right: var(--sp-5);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: background 150ms ease-out, border-color 150ms ease-out, color 150ms ease-out;
    }
    .theme-toggle:hover { background: var(--surface-alt); }
    .theme-toggle:active { transform: scale(0.96); }
    .theme-toggle svg { width: 20px; height: 20px; }
    .theme-toggle .icon-moon { display: none; }
    [data-theme="dark"] .theme-toggle .icon-sun { display: none; }
    [data-theme="dark"] .theme-toggle .icon-moon { display: block; }

    /* ── Utility classes ───────────────────────────────── */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 var(--sp-6);
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--sp-2);
      padding: var(--sp-3) var(--sp-6);
      border: 0;
      border-radius: var(--r-lg);
      background: var(--accent);
      color: var(--accent-text);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.4;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: background 150ms ease-out, box-shadow 150ms ease-out, transform 100ms ease-out;
    }
    .btn-primary:hover { background: var(--accent-hover); box-shadow: var(--shadow-md); }
    .btn-primary:active { transform: scale(0.96); }
    .btn-primary:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .btn-lg {
      padding: var(--sp-4) var(--sp-8);
      font-size: 1.125rem;
      border-radius: var(--r-xl);
    }

    /* ── Variant-specific shared styles ────────────────── */
    .landing-page {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .logo-mark {
      display: inline-flex;
      align-items: center;
      gap: var(--sp-3);
    }
    .logo-mark svg { width: 40px; height: 40px; flex-shrink: 0; }
    .logo-mark span {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-md);
    }

    .feature-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: var(--r-lg);
      background: var(--acme-50);
      color: var(--accent);
    }
    [data-theme="dark"] .feature-icon {
      background: oklch(0.28 0.04 300.3);
    }
    .feature-icon svg { width: 24px; height: 24px; }

    .section-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--text);
    }
    .section-subtitle {
      font-size: 1rem;
      line-height: 1.6;
      color: var(--text-muted);
      max-width: 540px;
    }
  </style>
</head>
<body>
  <div id="stage"></div>

  <nav class="proto-picker" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Bold Statement</button>
    <button class="proto-picker-item">Feature Showcase</button>
    <button class="proto-picker-item">Simple &amp; Direct</button>
  </nav>

  <script>
    /* ── Dark mode toggle ──────────────────────────────── */
    function toggleTheme() {
      const html = document.documentElement;
      const next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      html.setAttribute('data-theme', next);
    }

    /* ── SVG logo (inline) ─────────────────────────────── */

    const themeToggle = `
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>`;

    /* ── Feature icons ─────────────────────────────────── */
    const iconAssess = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>`;
    const iconReport = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>`;
    const iconUsers = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`;

    /* ── Variants ──────────────────────────────────────── */
    const variants = [

      /* ═══════════════════════════════════════════════════
         Variant 1 — Bold Statement
         Axis: dramatic hero, oversized type, gradient bg
         ═══════════════════════════════════════════════════ */
      function variant1() {
        return `
          <div class="landing-page" style="
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
          ">
            ${themeToggle}

            <!-- Gradient backdrop -->
            <div style="
              position: absolute;
              inset: 0;
              background:
                radial-gradient(ellipse 80% 60% at 50% 40%, oklch(0.502 0.126 300.4 / 0.15), transparent),
                radial-gradient(ellipse 60% 50% at 20% 80%, oklch(0.502 0.126 300.4 / 0.08), transparent),
                radial-gradient(ellipse 60% 50% at 80% 20%, oklch(0.46 0.120 300.4 / 0.06), transparent);
              pointer-events: none;
            "></div>

            <!-- Card -->
            <div style="
              position: relative;
              z-index: 1;
              display: flex;
              flex-direction: column;
              align-items: center;
              text-align: center;
              gap: var(--sp-8);
              padding: var(--sp-16) var(--sp-10);
              max-width: 560px;
              width: 100%;
              background: var(--surface);
              border: 1px solid var(--border);
              border-radius: var(--r-xl);
              box-shadow: var(--shadow-lg);
            ">
              <div class="logo-mark" style="flex-direction: column; gap: var(--sp-2);">
                <img src="acme-logo.png" alt="ACME Corp" width="40" height="40" style="object-fit:contain;">
                <span style="font-size: 0.875rem; font-weight: 600; color: var(--text-muted); letter-spacing: 0.08em; text-transform: uppercase;">ACME Corp</span>
              </div>

              <h1 style="
                font-size: clamp(2rem, 5vw, 3rem);
                font-weight: 700;
                letter-spacing: -0.03em;
                line-height: 1.15;
                color: var(--text);
                max-width: 480px;
              ">Welcome to ACME Corp</h1>

              <p style="
                font-size: 1.125rem;
                line-height: 1.6;
                color: var(--text-muted);
                max-width: 400px;
              ">Your partner in explosives management.</p>

              <button class="btn-primary btn-lg" style="margin-top: var(--sp-4);">
                Sign in
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
              </button>
            </div>

            <!-- Footer -->
            <p style="
              position: relative;
              z-index: 1;
              margin-top: var(--sp-8);
              font-size: 0.8125rem;
              color: var(--text-muted);
            ">© ACME Corp</p>
          </div>`;
      },

      /* ═══════════════════════════════════════════════════
         Variant 2 — Feature Showcase
         Axis: hero + feature grid + social proof + CTA
         ═══════════════════════════════════════════════════ */
      function variant2() {
        return `
          <div class="landing-page">
            ${themeToggle}

            <!-- Hero -->
            <section style="
              display: flex;
              flex-direction: column;
              align-items: center;
              text-align: center;
              padding: var(--sp-20) var(--sp-6) var(--sp-16);
              position: relative;
              overflow: hidden;
            ">
              <div style="
                position: absolute;
                inset: 0;
                background: radial-gradient(ellipse 70% 50% at 50% 30%, oklch(0.502 0.126 300.4 / 0.08), transparent);
                pointer-events: none;
              "></div>

              <div style="position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: var(--sp-6);">
                <div class="logo-mark">
                  <img src="acme-logo.png" alt="ACME Corp" width="40" height="40" style="object-fit:contain;">
                  <span>ACME Corp</span>
                </div>

                <h1 style="
                  font-size: clamp(1.75rem, 4vw, 2.5rem);
                  font-weight: 700;
                  letter-spacing: -0.03em;
                  line-height: 1.2;
                  color: var(--text);
                  max-width: 520px;
                ">Welcome to ACME Corp</h1>

                <p style="
                  font-size: 1.0625rem;
                  line-height: 1.6;
                  color: var(--text-muted);
                  max-width: 440px;
                ">Your partner in explosives management.</p>

                <button class="btn-primary" style="margin-top: var(--sp-2);">
                  Sign in
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                </button>
              </div>
            </section>

            <!-- Features grid -->
            <section style="
              padding: var(--sp-16) var(--sp-6);
              background: var(--surface);
              border-top: 1px solid var(--border);
              border-bottom: 1px solid var(--border);
            ">
              <div class="container" style="display: flex; flex-direction: column; align-items: center; gap: var(--sp-12);">
                <div style="text-align: center; display: flex; flex-direction: column; align-items: center; gap: var(--sp-3);">
                  <h2 class="section-title">Everything you need</h2>
                  <p class="section-subtitle" style="text-align: center;">Streamline your explosives management with tools built for compliance, safety, and efficiency.</p>
                </div>

                <div style="
                  display: grid;
                  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
                  gap: var(--sp-6);
                  width: 100%;
                  max-width: 960px;
                ">
                  <!-- Feature 1 -->
                  <div class="card" style="padding: var(--sp-8); display: flex; flex-direction: column; gap: var(--sp-4);">
                    <div class="feature-icon">${iconAssess}</div>
                    <h3 style="font-size: 1.125rem; font-weight: 600; color: var(--text);">Assessments</h3>
                    <p style="font-size: 0.9375rem; line-height: 1.6; color: var(--text-muted);">Track and manage site assessments with automated checklists and real-time status updates.</p>
                  </div>

                  <!-- Feature 2 -->
                  <div class="card" style="padding: var(--sp-8); display: flex; flex-direction: column; gap: var(--sp-4);">
                    <div class="feature-icon">${iconReport}</div>
                    <h3 style="font-size: 1.125rem; font-weight: 600; color: var(--text);">Reporting</h3>
                    <p style="font-size: 0.9375rem; line-height: 1.6; color: var(--text-muted);">Generate compliance reports in seconds with built-in templates and export to PDF or CSV.</p>
                  </div>

                  <!-- Feature 3 -->
                  <div class="card" style="padding: var(--sp-8); display: flex; flex-direction: column; gap: var(--sp-4);">
                    <div class="feature-icon">${iconUsers}</div>
                    <h3 style="font-size: 1.125rem; font-weight: 600; color: var(--text);">User Management</h3>
                    <p style="font-size: 0.9375rem; line-height: 1.6; color: var(--text-muted);">Role-based access control with team invitations, permissions, and audit logging.</p>
                  </div>
                </div>
              </div>
            </section>

            <!-- Social proof -->
            <section style="padding: var(--sp-16) var(--sp-6);">
              <div class="container" style="display: flex; flex-direction: column; align-items: center; gap: var(--sp-8); text-align: center;">
                <p style="
                  font-size: 1.125rem;
                  font-style: italic;
                  line-height: 1.7;
                  color: var(--text-muted);
                  max-width: 560px;
                ">"ACME Corp transformed how we handle compliance. What used to take weeks now takes hours."</p>
                <div style="display: flex; flex-direction: column; gap: var(--sp-1);">
                  <span style="font-size: 0.9375rem; font-weight: 600; color: var(--text);">Sarah Chen</span>
                  <span style="font-size: 0.8125rem; color: var(--text-muted);">Director of Operations, BlastCo</span>
                </div>
              </div>
            </section>

            <!-- Bottom CTA -->
            <section style="
              padding: var(--sp-12) var(--sp-6);
              background: var(--surface);
              border-top: 1px solid var(--border);
            ">
              <div class="container" style="display: flex; flex-direction: column; align-items: center; gap: var(--sp-6); text-align: center;">
                <h2 class="section-title">Ready to get started?</h2>
                <button class="btn-primary btn-lg">
                  Sign in to your account
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                </button>
              </div>
            </section>

            <!-- Footer -->
            <footer style="
              padding: var(--sp-8) var(--sp-6);
              text-align: center;
              border-top: 1px solid var(--border);
            ">
              <p style="font-size: 0.8125rem; color: var(--text-muted);">© ACME Corp</p>
            </footer>
          </div>`;
      },

      /* ═══════════════════════════════════════════════════
         Variant 3 — Simple & Direct
         Axis: ultra-clean, plain bg, minimal decoration
         ═══════════════════════════════════════════════════ */
      function variant3() {
        return `
          <div class="landing-page" style="
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
          ">
            ${themeToggle}

            <div style="
              display: flex;
              flex-direction: column;
              align-items: center;
              text-align: center;
              gap: var(--sp-6);
              padding: var(--sp-12) var(--sp-8);
              max-width: 420px;
              width: 100%;
            ">
              <div class="logo-mark" style="flex-direction: column; gap: var(--sp-2);">
                <img src="acme-logo.png" alt="ACME Corp" width="40" height="40" style="object-fit:contain;">
                <span style="font-size: 0.8125rem; font-weight: 600; color: var(--text-muted); letter-spacing: 0.06em; text-transform: uppercase;">ACME Corp</span>
              </div>

              <div style="
                width: 48px;
                height: 1px;
                background: var(--border);
                margin: var(--sp-2) 0;
              "></div>

              <h1 style="
                font-size: 1.5rem;
                font-weight: 700;
                letter-spacing: -0.02em;
                line-height: 1.3;
                color: var(--text);
              ">Welcome to ACME Corp</h1>

              <p style="
                font-size: 1rem;
                line-height: 1.6;
                color: var(--text-muted);
              ">Your partner in explosives management.</p>

              <button class="btn-primary" style="margin-top: var(--sp-4);">
                Sign in
              </button>

              <p style="
                margin-top: var(--sp-10);
                font-size: 0.75rem;
                color: var(--text-muted);
              ">© ACME Corp</p>
            </div>
          </div>`;
      }
    ];

    /* ── Picker wiring (verbatim) ──────────────────────── */
    const stage = document.getElementById('stage');
    const picker = document.querySelector('.proto-picker');
    const highlight = picker.querySelector('.proto-picker-highlight');
    const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
    const replay = picker.querySelector('.proto-picker-replay');
    let current = 0;

    function moveHighlight() {
      const el = items[current];
      highlight.style.width = el.offsetWidth + 'px';
      highlight.style.transform = `translateX(${el.offsetLeft}px)`;
    }

    function mount(i) {
      stage.innerHTML = '';
      requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
    }

    function setActive(i) {
      if (i < 0 || i >= variants.length) return;
      current = i;
      items.forEach((el, j) => {
        el.toggleAttribute('data-active', j === i);
        if (j === i) el.setAttribute('aria-current', 'true');
        else el.removeAttribute('aria-current');
      });
      moveHighlight();
      const url = new URL(location);
      url.searchParams.set('v', i + 1);
      history.replaceState(null, '', url);
      mount(i);
    }

    items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
    replay?.addEventListener('click', () => mount(current));
    window.addEventListener('resize', moveHighlight);

    document.addEventListener('keydown', (e) => {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const num = parseInt(e.key, 10);
      if (num >= 1 && num <= variants.length) setActive(num - 1);
      else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
      else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
      else if (e.key === 'r' || e.key === 'R') mount(current);
    });

    setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
    requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
  </script>
</body>
</html>
